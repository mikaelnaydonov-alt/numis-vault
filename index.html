          setTimeout(() => setCloudStatus("idle"), 3000);

          setCloudStatus("error");
        } finally {

          {view === "historical" && (

              <span className="text-xs font-bold text-amber-400 font-mono w-16">{scrubberYear} AD</span>
              <input 
                type="range" 
                min="-500" 
                max="2026" 
                step="5" 
                value={scrubberYear} 
                onChange={e => setScrubberYear(parseInt(e.target.value))}
                className="flex-1 accent-amber-400 h-1.5 bg-slate-800 rounded-lg cursor-pointer"
              />
              <span className="text-[10px] text-slate-400 font-semibold">Active Scrubber</span>
            </div>
          )}

          {/* Main View Area */}
          <main className="flex-1 overflow-hidden relative">
            {view === "map" && (
              <InteractiveWorldMap 
                coins={vaultData.coins || []}
                onSelectModernCountry={(info) => {
                  setSelectedCountry(info);
                  setEditingCoin(null);
                  setIsModalOpen(true);
                }}
              />
            )}

            {view === "vault" && (
              <CollectionVault 
                coins={vaultData.coins || []} 
                onDeleteCoin={handleDeleteCoin}
                onEditCoin={(c) => {
                  setEditingCoin(c);
                  setSelectedCountry({ a3: c.countryCode, name: c.countryName });
                  setIsModalOpen(true);
                }}
                onAddClick={() => {
                  setEditingCoin(null);
                  setSelectedCountry(null);
                  setIsModalOpen(true);
                }}
              />
            )}

            {view === "historical" && (
              <HistoricalStudio 
                entities={vaultData.historicalEntities || []}
                scrubberYear={scrubberYear}
                onSaveEntity={handleSaveHistoricalEntity}
              />
            )}
          </main>

          {isModalOpen && (
            <AddEditCoinModal 
              initialCountry={selectedCountry}
              editingCoin={editingCoin}
              onClose={() => { setIsModalOpen(false); setEditingCoin(null); }}
              onSave={handleSaveCoin}
            />
          )}

        </div>
      );
    }

    // --- Interactive Modern World Map Engine ---
    function InteractiveWorldMap({ coins, onSelectModernCountry }) {
      const svgRef = useRef(null);

      const statusMap = useMemo(() => {
        const map = {};
        coins.forEach(c => {
          let targets = [c.countryCode];
          if (WEST_AFRICAN_CFA.includes(c.countryCode) && c.isUnion) targets = WEST_AFRICAN_CFA;
          if (EASTERN_CARIBBEAN.includes(c.countryCode) && c.isUnion) targets = EASTERN_CARIBBEAN;

          targets.forEach(code => {
            if (!map[code]) map[code] = { collected: true, neonColor: c.neonColor, abroadOnly: !c.inPossession };
            else if (c.inPossession) map[code].abroadOnly = false;
          });
        });
        return map;
      }, [coins]);

      useEffect(() => {
        const width = 800;
        const height = 480;
        const svg = d3.select(svgRef.current);
        svg.selectAll("*").remove();

        const defs = svg.append("defs");
        const hatch = defs.append("pattern")
          .attr("id", "diagonalHatchRed")
          .attr("width", 8).attr("height", 8)
          .attr("patternTransform", "rotate(45 0 0)").attr("patternUnits", "userSpaceOnUse");
        hatch.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 8)
          .attr("stroke", "#ff1744").attr("stroke-width", 2.5);

        const g = svg.append("g");
        const projection = d3.geoNaturalEarth1().scale(150).translate([width / 2, height / 1.9]);
        const path = d3.geoPath().projection(projection);

        const zoom = d3.zoom().scaleExtent([1, 14]).on("zoom", (e) => g.attr("transform", e.transform));
        svg.call(zoom);

        Promise.all([
          d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
          d3.tsv("https://unpkg.com/world-atlas@1.1.4/world/110m.tsv")
        ]).then(([atlasData, tsvData]) => {
          const nameMap = {};
          tsvData.forEach(d => { nameMap[d.iso_n3] = { a3: d.iso_a3, name: d.name }; });
          nameMap["728"] = { a3: "SSD", name: "South Sudan" };

          const countries = topojson.feature(atlasData, atlasData.objects.countries).features;

          g.selectAll("path")
            .data(countries)
            .enter().append("path")
            .attr("d", path)
            .attr("class", d => {
              const info = nameMap[d.id];
              const code = info ? info.a3 : null;
              const st = code ? statusMap[code] : null;
              if (!st) return "fill-[#0f1320] stroke-[#1b233a] stroke-[0.35] hover:fill-[#182035] cursor-pointer";
              return `neon-${st.neonColor} cursor-pointer ${st.abroadOnly ? "border-red-glow" : "stroke-white/30 stroke-[0.35]"}`;
            })
            .on("click", (e, d) => onSelectModernCountry(nameMap[d.id] || { a3: "WLD", name: "Selected Territory" }));

          // Micro-states
          g.selectAll(".micro-pin")
            .data(MICRO_STATES)
            .enter().append("circle")
            .attr("cx", d => projection(d.coords)[0])
            .attr("cy", d => projection(d.coords)[1])
            .attr("r", 2.6)
            .attr("class", d => {
              const st = statusMap[d.a3];
              if (!st) return "fill-[#242e44] stroke-cyan-400/60 hover:fill-[#00f0ff] cursor-pointer";
              return `neon-${st.neonColor} ${st.abroadOnly ? "border-red-glow stroke-[1.2]" : "stroke-white/70"}`;
            })
            .on("click", (e, d) => onSelectModernCountry({ a3: d.a3, name: d.name }));

          // Striped Territories
          g.selectAll(".territory-pin")
            .data(TERRITORIES_LIST)
            .enter().append("circle")
            .attr("cx", d => projection(d.coords)[0])
            .attr("cy", d => projection(d.coords)[1])
            .attr("r", 3)
            .attr("fill", "url(#diagonalHatchRed)")
            .attr("stroke", "#ff1744")
            .attr("stroke-width", 0.8)
            .attr("class", "cursor-pointer")
            .on("click", (e, d) => onSelectModernCountry({ a3: d.code, name: d.name, isTerritory: true, mother: d.mother }));
        });
      }, [statusMap]);

      return (
        <div className="w-full h-full bg-[#05070d] flex items-center justify-center overflow-hidden">
          <svg ref={svgRef} viewBox="0 0 800 480" className="w-full h-full object-contain"></svg>
        </div>
      );
    }

    // --- Dedicated Historical Cartographer Studio with Ocean Mask & Raw Drawing ---
    function HistoricalStudio({ entities, scrubberYear, onSaveEntity }) {
      const svgRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [rawPoints, setRawPoints] = useState([]);
      const [closedPolygons, setClosedPolygons] = useState([]);

      const [selectedPolygonIndex, setSelectedPolygonIndex] = useState(null);
      const [customizerOpen, setCustomizerOpen] = useState(false);

      // Overlap inspector modal state
      const [inspectingEntity, setInspectingEntity] = useState(null);

      // Interactive Mint Placement State
      const [placingMint, setPlacingMint] = useState(false);
      const [mintCandidate, setMintCandidate] = useState(null);
      const [mintCandidateCountry, setMintCandidateCountry] = useState("");
      const [confirmedMint, setConfirmedMint] = useState(null);

      const [metaModalOpen, setMetaModalOpen] = useState(true);
      const [entityMeta, setEntityMeta] = useState({
        name: "",
        ruler: "",
        startYear: "",
        endYear: "",
        mintCity: ""
      });

      const projectionRef = useRef(d3.geoNaturalEarth1().scale(150).translate([400, 250]));
      const worldGeoRef = useRef(null);

      useEffect(() => {
        const svg = d3.select(svgRef.current);
        svg.selectAll("*").remove();

        const defs = svg.append("defs");

        // Custom hatch patterns for closed polygons
        closedPolygons.forEach((poly, idx) => {
          if (poly.striped) {
            const pat = defs.append("pattern")
              .attr("id", `stripe-pat-${idx}`)
              .attr("width", 8).attr("height", 8)
              .attr("patternTransform", "rotate(45 0 0)")
              .attr("patternUnits", "userSpaceOnUse");
            
            pat.append("rect").attr("width", 8).attr("height", 8).attr("fill", poly.bgColor || "#111625");
            pat.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 8)
              .attr("stroke", poly.stripeColor || "#ff1744").attr("stroke-width", 2.5);
          }
        });

        // Layer Ordering:
        // 1. Base Map Background
        // 2. Empire Drawing Layer (Historical Polygons)
        // 3. Ocean Mask Layer (Covers drawings that spill into the sea)
        // 4. Country Borders / Mint Pin Layer
        const gRoot = svg.append("g").attr("id", "studio-root");
        const gBase = gRoot.append("g").attr("id", "layer-base");
        const gEmpire = gRoot.append("g").attr("id", "layer-empires");
        const gOceanMask = gRoot.append("g").attr("id", "layer-ocean-mask");
        const gBorders = gRoot.append("g").attr("id", "layer-borders");

        const path = d3.geoPath().projection(projectionRef.current);

        const zoom = d3.zoom().scaleExtent([1, 14]).on("zoom", (e) => {
          if (!isDrawing) gRoot.attr("transform", e.transform);
        });
        svg.call(zoom);

        Promise.all([
          d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
          d3.tsv("https://unpkg.com/world-atlas@1.1.4/world/110m.tsv")
        ]).then(([atlasData, tsvData]) => {
          const land = topojson.feature(atlasData, atlasData.objects.land);
          const countries = topojson.feature(atlasData, atlasData.objects.countries).features;
          
          worldGeoRef.current = { features: countries, tsv: tsvData, land: land };

          // 1. Dark Dry Land Base
          gBase.append("path")
            .datum(land)
            .attr("d", path)
            .attr("fill", "#0b0f1d");

          // 3. Ocean Mask: Inverts land so water covers freehand spills
          // Creates a full world bounding box, subtracting land polygons
          const sphere = { type: "Sphere" };
          gOceanMask.append("path")
            .datum(sphere)
            .attr("d", path)
            .attr("fill", "none")
            .attr("stroke", "#192238")
            .attr("stroke-width", 0.5);

          // Render ghost modern country borders on dry land
          gBorders.selectAll(".ghost-country")
            .data(countries)
            .enter().append("path")
            .attr("d", path)
            .attr("fill", "transparent")
            .attr("stroke", "#1e293b")
            .attr("stroke-width", 0.4);
        });

        // Pointer event for zero-decimation freehand drawing
        svg.on("pointerdown", (event) => {
          if (placingMint) {
            const [mx, my] = d3.pointer(event, gRoot.node());
            const coords = projectionRef.current.invert([mx, my]);
            if (coords) {
              setMintCandidate(coords);
              setMintCandidateCountry(detectCountry(coords));
            }
            return;
          }

          if (!isDrawing) return;
          const [mx, my] = d3.pointer(event, gRoot.node());
          const coords = projectionRef.current.invert([mx, my]);
          if (coords) setRawPoints([coords]);
        });

        svg.on("pointermove", (event) => {
          if (!isDrawing || rawPoints.length === 0) return;
          const [mx, my] = d3.pointer(event, gRoot.node());
          const coords = projectionRef.current.invert([mx, my]);
          // ZERO DECIMATION: Add every single coordinate point
          if (coords) setRawPoints(prev => [...prev, coords]);
        });

        svg.on("pointerup", () => {
          if (!isDrawing || rawPoints.length < 3) return;
          const newPoly = {
            points: rawPoints,
            bgColor: "#ffd600",
            striped: false,
            stripeColor: "#ff1744"
          };
          setClosedPolygons(prev => [...prev, newPoly]);
          setRawPoints([]);
          setIsDrawing(false);
        });

      }, [isDrawing, closedPolygons, placingMint]);

      const detectCountry = (coords) => {
        if (!worldGeoRef.current || !coords) return "Unknown Territory / Sea";
        const found = worldGeoRef.current.features.find(feature => d3.geoContains(feature, coords));
        if (found) {
          const item = worldGeoRef.current.tsv.find(t => t.iso_n3 === found.id);
          return item ? item.name : "Sovereign Territory";
        }
        return "Coastal / Ocean Waters";
      };

      const detectOverlappingCountries = (polyPoints) => {
        if (!worldGeoRef.current || !polyPoints || polyPoints.length === 0) return [];
        const overlaps = new Set();
        // Check intersections with modern nation centroids & sample vertices
        worldGeoRef.current.features.forEach(feat => {
          const center = d3.geoCentroid(feat);
          if (d3.polygonContains(polyPoints, center)) {
            const item = worldGeoRef.current.tsv.find(t => t.iso_n3 === feat.id);
            if (item) overlaps.add(item.name);
          }
        });
        return Array.from(overlaps);
      };

      const handleSaveCompleteEntity = () => {
        if (!entityMeta.name) {
          alert("Please enter a name for the entity.");
          return;
        }

        const fullEntity = {
          id: Date.now().toString(),
          name: entityMeta.name,
          ruler: entityMeta.ruler,
          startYear: parseInt(entityMeta.startYear) || -500,
          endYear: parseInt(entityMeta.endYear) || 2026,
          polygons: closedPolygons,
          mint: confirmedMint ? {
            city: entityMeta.mintCity,
            country: confirmedMint.country,
            coords: confirmedMint.coords
          } : null
        };

        onSaveEntity(fullEntity);
        alert(`Saved ${entityMeta.name} to Historical Vault!`);
      };

      // Filter entities visible under current timeline scrubber year
      const visibleHistoricalEntities = useMemo(() => {
        return (entities || []).filter(e => scrubberYear >= e.startYear && scrubberYear <= e.endYear);
      }, [entities, scrubberYear]);

      return (
        <div className="relative w-full h-full bg-[#05070d] overflow-hidden flex flex-col">

          {/* SVG Map Canvas */}
          <svg ref={svgRef} viewBox="0 0 800 480" className="w-full h-full object-contain">
            
            {/* Render Saved Historical Entities Synced to Scrubber */}
            {visibleHistoricalEntities.map((ent) => (
              <g key={ent.id} onClick={() => setInspectingEntity(ent)} className="cursor-pointer">
                {(ent.polygons || []).map((poly, pIdx) => {
                  const pts = poly.points.map(p => projectionRef.current(p));
                  const d = d3.line().curve(d3.curveLinearClosed)(pts);
                  return (
                    <path
                      key={pIdx}
                      d={d}
                      fill={poly.bgColor || "#00f0ff"}
                      fillOpacity={0.6}
                      stroke={poly.bgColor || "#00f0ff"}
                      strokeWidth={1.5}
                    />
                  );
                })}

                {ent.mint && (
                  <g transform={`translate(${projectionRef.current(ent.mint.coords)[0]}, ${projectionRef.current(ent.mint.coords)[1]})`}>
                    <circle r={5} fill="#ff1744" filter="drop-shadow(0 0 6px #ff1744)" />
                    <circle r={2} fill="#ffffff" />
                  </g>
                )}
              </g>
            ))}

            {/* Render Currently Active Drawing Session Polygons */}
            {closedPolygons.map((poly, idx) => {
              const pts = poly.points.map(p => projectionRef.current(p));
              const d = d3.line().curve(d3.curveLinearClosed)(pts);
              return (
                <path
                  key={idx}
                  d={d}
                  fill={poly.striped ? `url(#stripe-pat-${idx})` : poly.bgColor}
                  fillOpacity={0.65}
                  stroke={poly.bgColor || "#ffd600"}
                  strokeWidth={1.5}
                  className="cursor-pointer"
                  onClick={() => {
                    setSelectedPolygonIndex(idx);
                    setCustomizerOpen(true);
                  }}
                />
              );
            })}

            {/* Zero-Decimation In-Progress Finger Stroke */}
            {rawPoints.length > 0 && (
              <path 
                d={d3.line()(rawPoints.map(p => projectionRef.current(p)))} 
                fill="none" 
                stroke="#39ff14" 
                strokeWidth={2} 
              />
            )}

            {/* Interactive Mint Placement Crosshair & Confirmation Target */}
            {mintCandidate && (
              <g transform={`translate(${projectionRef.current(mintCandidate)[0]}, ${projectionRef.current(mintCandidate)[1]})`}>
                <circle r={9} fill="none" stroke="#ff1744" strokeWidth={2} className="animate-ping" />
                <circle r={5} fill="#ff1744" />
                <circle r={1.5} fill="#ffffff" />
              </g>
            )}

            {confirmedMint && !mintCandidate && (
              <g transform={`translate(${projectionRef.current(confirmedMint.coords)[0]}, ${projectionRef.current(confirmedMint.coords)[1]})`}>
                <circle r={6} fill="#ff1744" filter="drop-shadow(0 0 6px #ff1744)" />
                <circle r={2} fill="#ffffff" />
              </g>
            )}
          </svg>

          {/* Floating Top Entity Details Bar */}
          <div className="absolute top-2 inset-x-2 z-20 flex items-center justify-between bg-[#0b101ef0] p-2 rounded-xl border border-slate-800 backdrop-blur-md">
            <div className="flex-1 mr-2">
              <div className="text-xs font-bold text-white flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                {entityMeta.name || "Untitled Entity"}
              </div>
              <div className="text-[10px] text-slate-400">
                {entityMeta.ruler || "Ruler"} • {entityMeta.startYear || "Year"} to {entityMeta.endYear || "Year"}
              </div>
            </div>

            <div className="flex items-center gap-1.5">
              <button 
                onClick={() => setMetaModalOpen(true)} 
                className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-2.5 py-1 rounded-lg">
                Edit Info
              </button>
              <button 
                onClick={handleSaveCompleteEntity} 
                className="bg-amber-400 hover:bg-amber-300 font-extrabold text-black text-xs px-3 py-1 rounded-lg shadow-md">
                Save Entity
              </button>
            </div>
          </div>

          {/* Bottom Floating Control Bar */}
          <div className="absolute bottom-3 inset-x-3 z-30 flex items-center justify-between pointer-events-none">
            
            {/* Mint Location Button */}
            <div className="pointer-events-auto">
              <button 
                onClick={() => { setPlacingMint(!placingMint); setIsDrawing(false); }}
                className={`px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-lg ${placingMint ? "bg-red-500 text-white animate-pulse" : "bg-[#101526] border border-slate-700 text-slate-200"}`}>
                <span>📍</span>
                <span>{confirmedMint ? "Mint Placed" : "Place Mint"}</span>
              </button>
            </div>

            {/* Zero-Decimation Pencil Drawing Button */}
            <div className="pointer-events-auto flex items-center gap-2">
              <button 
                onClick={() => { setIsDrawing(!isDrawing); setPlacingMint(false); }}
                className={`px-4 py-2 rounded-xl text-xs font-black flex items-center gap-1.5 shadow-xl transition-all ${isDrawing ? "bg-[#39ff14] text-black ring-4 ring-[#39ff14]/30" : "bg-amber-400 text-black"}`}>
                <span>✏️</span>
                <span>{isDrawing ? "Tracing Border..." : "Draw Empire"}</span>
              </button>
            </div>
          </div>

          {/* Interactive Mint Confirmation Dialog */}
          {placingMint && mintCandidate && (
            <div className="absolute bottom-16 inset-x-4 z-40 bg-[#0c1222f6] border border-red-500/60 p-3 rounded-2xl shadow-2xl backdrop-blur-md flex items-center justify-between">
              <div>
                <div className="text-xs font-bold text-white">Place Mint Here?</div>
                <div className="text-[10px] text-slate-400">Detected: <span className="text-red-400 font-semibold">{mintCandidateCountry}</span></div>
              </div>
              <div className="flex gap-2">
                <button 
                  onClick={() => setMintCandidate(null)} 
                  className="px-2.5 py-1 bg-slate-800 text-slate-300 text-xs rounded-lg font-bold">
                  Cancel
                </button>
                <button 
                  onClick={() => {
                    setConfirmedMint({ coords: mintCandidate, country: mintCandidateCountry });
                    setMintCandidate(null);
                    setPlacingMint(false);
                  }} 
                  className="px-3 py-1 bg-red-600 hover:bg-red-500 text-white text-xs rounded-lg font-extrabold shadow-md">
                  Confirm
                </button>
              </div>
            </div>
          )}

          {/* Initial Info Setup Modal */}
          {metaModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0e1424] border border-slate-800 rounded-3xl w-full max-w-sm p-4 space-y-3 shadow-2xl">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <h3 className="text-xs font-bold text-white uppercase tracking-wider">Historical Entity Setup</h3>
                  <button onClick={() => setMetaModalOpen(false)} className="text-slate-400 hover:text-white text-sm font-bold">✕</button>
                </div>

                <div className="space-y-2.5 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Entity / Empire Name *</label>
                    <input 
                      required 
                      value={entityMeta.name} 
                      onChange={e => setEntityMeta({...entityMeta, name: e.target.value})}
                      placeholder="e.g. Polish-Lithuanian Commonwealth" 
                      className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" 
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-400 block mb-1">Start Year</label>
                      <input 
                        type="number" 
                        value={entityMeta.startYear} 
                        onChange={e => setEntityMeta({...entityMeta, startYear: e.target.value})}
                        placeholder="e.g. 1569" 
                        className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" 
                      />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">End Year</label>
                      <input 
                        type="number" 
                        value={entityMeta.endYear} 
                        onChange={e => setEntityMeta({...entityMeta, endYear: e.target.value})}
                        placeholder="e.g. 1795" 
                        className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" 
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Ruler / Monarch</label>
                    <input 
                      value={entityMeta.ruler} 
                      onChange={e => setEntityMeta({...entityMeta, ruler: e.target.value})}
                      placeholder="e.g. Sigismund III Vasa" 
                      className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" 
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 block mb-1">Mint City Label</label>
                    <input 
                      value={entityMeta.mintCity} 
                      onChange={e => setEntityMeta({...entityMeta, mintCity: e.target.value})}
                      placeholder="e.g. Kraków / Vilnius" 
                      className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" 
                    />
                  </div>

                  <button 
                    onClick={() => setMetaModalOpen(false)} 
                    className="w-full py-2.5 bg-amber-400 text-black font-extrabold rounded-xl text-xs uppercase tracking-wider shadow-lg">
                    Continue to Map & Drawing
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Polygon Color & Striping Customizer */}
          {customizerOpen && selectedPolygonIndex !== null && (
            <div className="fixed inset-x-0 bottom-0 z-50 bg-[#0d1324] border-t border-slate-700 rounded-t-3xl p-4 max-h-[60vh] overflow-y-auto hide-scrollbar space-y-3 shadow-2xl">
              <div className="flex items-center justify-between pb-1 border-b border-slate-800">
                <h3 className="text-xs font-bold text-white">Closed Polygon #{selectedPolygonIndex + 1} Style</h3>
                <button onClick={() => setCustomizerOpen(false)} className="text-slate-400 hover:text-white font-bold text-sm">✕</button>
              </div>

              <div className="flex items-center justify-between bg-[#12192e] p-2.5 rounded-xl border border-slate-800">
                <div>
                  <div className="text-xs font-semibold text-white">Diagonal Striped Hatching</div>
                  <div className="text-[10px] text-slate-400">Mark outer expansion or disputed zone</div>
                </div>
                <input 
                  type="checkbox" 
                  checked={closedPolygons[selectedPolygonIndex]?.striped || false} 
                  onChange={e => {
                    const st = e.target.checked;
                    setClosedPolygons(prev => prev.map((p, i) => i === selectedPolygonIndex ? { ...p, striped: st } : p));
                  }} 
                  className="w-5 h-5 accent-red-500" 
                />
              </div>

              <div>
                <label className="text-[11px] font-bold text-slate-300 block mb-1">Fill Background Color (64 Options):</label>
                <div className="grid grid-cols-8 gap-1.5 max-h-32 overflow-y-auto hide-scrollbar p-1.5 bg-[#070b14] rounded-xl border border-slate-800">
                  {PALETTE_64.map(color => (
                    <button
                      key={color}
                      onClick={() => {
                        setClosedPolygons(prev => prev.map((p, i) => i === selectedPolygonIndex ? { ...p, bgColor: color } : p));
                      }}
                      style={{ backgroundColor: color }}
                      className="w-full h-5 rounded-md hover:scale-110 transition-transform"
                    />
                  ))}
                </div>
              </div>

              {closedPolygons[selectedPolygonIndex]?.striped && (
                <div>
                  <label className="text-[11px] font-bold text-red-400 block mb-1">Stripe Line Color:</label>
                  <div className="grid grid-cols-8 gap-1.5 max-h-32 overflow-y-auto hide-scrollbar p-1.5 bg-[#070b14] rounded-xl border border-slate-800">
                    {PALETTE_64.map(color => (
                      <button
                        key={color}
                        onClick={() => {
                          setClosedPolygons(prev => prev.map((p, i) => i === selectedPolygonIndex ? { ...p, stripeColor: color } : p));
                        }}
                        style={{ backgroundColor: color }}
                        className="w-full h-5 rounded-md hover:scale-110 transition-transform"
                      />
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Overlapping Modern Nations Inspector Modal */}
          {inspectingEntity && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0e1424] border border-slate-800 rounded-3xl w-full max-w-sm p-4 space-y-3 shadow-2xl">
                <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                  <h3 className="text-xs font-bold text-white">{inspectingEntity.name}</h3>
                  <button onClick={() => setInspectingEntity(null)} className="text-slate-400 hover:text-white text-sm font-bold">✕</button>
                </div>

                <div className="text-xs space-y-1 bg-[#12182b] p-2.5 rounded-xl border border-slate-800">
                  <div><span className="text-slate-400">Ruler:</span> {inspectingEntity.ruler || "—"}</div>
                  <div><span className="text-slate-400">Timeline:</span> {inspectingEntity.startYear} – {inspectingEntity.endYear}</div>
                  {inspectingEntity.mint && (
                    <div><span className="text-slate-400">Mint:</span> {inspectingEntity.mint.city} ({inspectingEntity.mint.country})</div>
                  )}
                </div>

                <div>
                  <label className="text-[11px] font-bold text-cyan-400 block mb-1.5">Overlapping Modern Countries:</label>
                  <div className="flex flex-wrap gap-1 max-h-36 overflow-y-auto hide-scrollbar">
                    {detectOverlappingCountries(inspectingEntity.polygons?.[0]?.points).map((country, idx) => (
                      <span key={idx} className="bg-slate-800 border border-slate-700 px-2 py-0.5 rounded-md text-[10px] text-slate-300">
                        {country}
                      </span>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // --- Vault Cards Tab (Text-Only Lightweight) ---
    function CollectionVault({ coins, onDeleteCoin, onEditCoin, onAddClick }) {
      const [query, setQuery] = useState("");

      const filtered = useMemo(() => {
        return coins.filter(c => 
          c.countryName.toLowerCase().includes(query.toLowerCase()) ||
          c.denomination.toLowerCase().includes(query.toLowerCase()) ||
          (c.mint && c.mint.toLowerCase().includes(query.toLowerCase())) ||
          (c.ruler && c.ruler.toLowerCase().includes(query.toLowerCase()))
        );
      }, [coins, query]);

      return (
        <div className="flex flex-col h-full p-3.5 overflow-y-auto hide-scrollbar space-y-3">
          <div className="flex gap-2">
            <input 
              type="text" 
              placeholder="Search coin, ruler, mint..." 
              value={query}
              onChange={e => setQuery(e.target.value)}
              className="flex-1 bg-[#101524] border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-[#00f0ff]" 
            />
            <button onClick={onAddClick} className="bg-[#00f0ff] font-bold text-black text-xs px-3 rounded-xl shadow-lg">+ Add</button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pb-8">
            {filtered.length === 0 ? (
              <div className="col-span-full py-16 text-center text-slate-500 text-xs">
                No coins found in vault.
              </div>
            ) : (
              filtered.map(coin => (
                <div 
                  key={coin.id} 
                  className={`bg-[#0f1424] border rounded-2xl p-3 space-y-2 relative ${!coin.inPossession ? "border-[#ff1744] shadow-[0_0_6px_rgba(255,23,68,0.2)]" : "border-slate-800"}`}>
                  
                  <div className="flex items-start justify-between">
                    <div>
                      <h3 className="font-bold text-sm text-white">{coin.countryName}</h3>
                      <p className="text-[11px] text-[#00f0ff] font-semibold">{coin.denomination}</p>
                    </div>

                    <div className="flex items-center gap-1">
                      <button onClick={() => onEditCoin(coin)} className="text-slate-400 hover:text-white p-1 text-xs" title="Edit">✏️</button>
                      <button onClick={() => onDeleteCoin(coin.id)} className="text-slate-400 hover:text-red-400 p-1 text-xs" title="Delete">🗑</button>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-1 bg-[#080b14] p-1.5 rounded-lg text-[10px] text-slate-300">
                    <div><span className="text-slate-500">Year:</span> {coin.year || "—"}</div>
                    <div><span className="text-slate-500">Grade:</span> {coin.grade || "UNC"}</div>
                    <div className="truncate"><span className="text-slate-500">Mint:</span> {coin.mint || "—"}</div>
                    <div className="truncate"><span className="text-slate-500">Ruler:</span> {coin.ruler || "—"}</div>
                  </div>

                  {coin.notes && <p className="text-[10px] text-slate-400 italic">"{coin.notes}"</p>}
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // --- Coin Entry & Edit Drawer ---
    function AddEditCoinModal({ initialCountry, editingCoin, onClose, onSave }) {
      const [formData, setFormData] = useState(() => {
        if (editingCoin) return { ...editingCoin };
        return {
          countryCode: initialCountry?.a3 || "TUV",
          countryName: initialCountry?.name || "Tuvalu",
          isTerritory: !!initialCountry?.isTerritory,
          motherCountry: initialCountry?.mother || "",
          denomination: "",
          year: "",
          ruler: "",
          mint: "",
          grade: "UNC",
          inPossession: true,
          isUnion: false,
          neonColor: "cyan",
          notes: ""
        };
      });

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-[#0e1424] border border-slate-800 rounded-t-3xl sm:rounded-3xl w-full max-w-lg p-4 max-h-[90vh] overflow-y-auto hide-scrollbar space-y-3.5">
            <div className="flex items-center justify-between pb-2 border-b border-slate-800">
              <h2 className="text-xs font-bold text-white">
                {editingCoin ? "Edit Coin:" : "Add Coin:"} <span className="text-[#00f0ff]">{formData.countryName}</span>
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white font-bold text-base">✕</button>
            </div>

            <form onSubmit={e => { e.preventDefault(); onSave(formData); }} className="space-y-3 text-xs">
              <div>
                <label className="text-slate-400 block mb-1">Country / Territory</label>
                <select 
                  value={formData.countryCode} 
                  onChange={e => {
                    const code = e.target.value;
                    const foundSov = SOVEREIGN_LIST.find(s => s.a3 === code);
                    const foundTer = TERRITORIES_LIST.find(t => t.code === code);
                    if (foundSov) setFormData(p => ({ ...p, countryCode: foundSov.a3, countryName: foundSov.name, isTerritory: false }));
                    if (foundTer) setFormData(p => ({ ...p, countryCode: foundTer.code, countryName: foundTer.name, isTerritory: true, motherCountry: foundTer.mother }));
                  }}
                  className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white">
                  <optgroup label="Sovereign Nations">
                    {SOVEREIGN_LIST.map(s => <option key={s.a3} value={s.a3}>{s.name} ({s.a3})</option>)}
                  </optgroup>
                  <optgroup label="Territories & Dependencies">
                    {TERRITORIES_LIST.map(t => <option key={t.code} value={t.code}>{t.name} ({t.mother})</option>)}
                  </optgroup>
                </select>
              </div>

              <div className="grid grid-cols-2 gap-2.5">
                <div>
                  <label className="text-slate-400 block mb-1">Denomination *</label>
                  <input required value={formData.denomination} onChange={e => setFormData({...formData, denomination: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">Year</label>
                  <input value={formData.year} onChange={e => setFormData({...formData, year: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2.5">
                <div>
                  <label className="text-slate-400 block mb-1">Mint City / Mintmark</label>
                  <input value={formData.mint} onChange={e => setFormData({...formData, mint: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">Ruler / Head of State</label>
                  <input value={formData.ruler} onChange={e => setFormData({...formData, ruler: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
              </div>

              <div className="p-2.5 bg-[#12182b] rounded-xl border border-slate-800 flex items-center justify-between">
                <div>
                  <div className="font-semibold text-white">In Physical Possession</div>
                  <div className="text-[10px] text-slate-400">If unchecked, marked with slim red border</div>
                </div>
                <input 
                  type="checkbox" 
                  checked={formData.inPossession} 
                  onChange={e => setFormData({...formData, inPossession: e.target.checked})} 
                  className="w-5 h-5 accent-[#00f0ff]" 
                />
              </div>

              <div>
                <label className="text-slate-400 block mb-1">Notes</label>
                <input value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} placeholder="e.g. Acquired from coin fair" className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
              </div>

              <button type="submit" className="w-full py-2.5 bg-[#00f0ff] hover:bg-[#00d0df] text-black font-extrabold rounded-xl text-xs uppercase tracking-wider shadow-lg">
                Save Coin to Vault
              </button>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
