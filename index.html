    const getFlagEmoji = (a2) => {
      if (!a2 || a2.length !== 2) return "🏳️";
      return String.fromCodePoint(...a2.toUpperCase().split("").map(c => 127397 + c.charCodeAt(0)));
    };

    const formatYearDisplay = (yr) => {
      if (!yr && yr !== 0) return "—";
      const s = String(yr).trim();
      if (s.includes("-") && !s.startsWith("-")) return `${s} AD`;
      const num = parseInt(s);
      if (isNaN(num)) return s;
      return num < 0 ? `${Math.abs(num)} BC` : `${num} AD`;
    };

    function App() {
      const [view, setView] = useState("map");
      const [isSyncing, setIsSyncing] = useState(false);
      const [cloudStatus, setCloudStatus] = useState("idle");
      const [vaultData, setVaultData] = useState({ coins: [], historicalEntities: [] });

      const [selectedCountry, setSelectedCountry] = useState(null);
      const [editingCoin, setEditingCoin] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [showTerritories, setShowTerritories] = useState(false);

      const [scrubberYear, setScrubberYear] = useState(1600);
      const [mapFocusTarget, setMapFocusTarget] = useState(null);

      useEffect(() => {
        setIsSyncing(true);
        fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Master-Key": API_KEY }
        })
          .then(res => res.json())
          .then(data => {
            if (data && data.record) {
              setVaultData({
                coins: data.record.coins || [],
                historicalEntities: data.record.historicalEntities || []
              });
            }
          })
          .catch(err => console.error("Cloud fetch error:", err))
          .finally(() => setIsSyncing(false));
      }, []);

      const pushToCloud = async (updated) => {
        setVaultData(updated);
        setIsSyncing(true);
        setCloudStatus("saving");

        try {
          const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "X-Master-Key": API_KEY,
              "X-Bin-Versioning": "false"
            },
            body: JSON.stringify(updated)
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          setCloudStatus("saved");
          setTimeout(() => setCloudStatus("idle"), 3000);
        } catch (err) {
          console.error("Cloud sync error:", err);
          setCloudStatus("error");
        } finally {
          setIsSyncing(false);
        }
      };

      const sovereignCount = useMemo(() => {
        const set = new Set();
        (vaultData.coins || []).forEach(c => {
          if (!c.isTerritory && !c.isHistorical && SOVEREIGN_LIST.some(s => s.a3 === c.countryCode)) set.add(c.countryCode);
        });
        return set.size;
      }, [vaultData.coins]);

      const sovereignPercent = ((sovereignCount / 195) * 100).toFixed(2);

      const handleSaveCoin = (coin) => {
        const list = vaultData.coins || [];
        let updatedList;
        if (editingCoin) {
          updatedList = list.map(c => c.id === editingCoin.id ? { ...coin, id: c.id } : c);
        } else {
          updatedList = [{ ...coin, id: Date.now().toString(), createdAt: new Date().toISOString() }, ...list];
        }
        pushToCloud({ ...vaultData, coins: updatedList });
        setIsModalOpen(false);
        setEditingCoin(null);
      };

      const handleDeleteCoin = (id) => {
        if (window.confirm("Delete this coin from vault?")) {
          const updatedList = (vaultData.coins || []).filter(c => c.id !== id);
          pushToCloud({ ...vaultData, coins: updatedList });
        }
      };

      const handleSaveHistoricalEntity = (entity) => {
        const list = vaultData.historicalEntities || [];
        const exists = list.some(e => e.id === entity.id);
        const updatedEntities = exists ? list.map(e => e.id === entity.id ? entity : e) : [entity, ...list];
        pushToCloud({ ...vaultData, historicalEntities: updatedEntities });
      };

      const handleAddHistoricalCoin = (entityId, coinInfo) => {
        const newCoin = {
          ...coinInfo,
          id: Date.now().toString(),
          isHistorical: true,
          entityId: entityId,
          createdAt: new Date().toISOString()
        };
        const updatedCoins = [newCoin, ...(vaultData.coins || [])];
        pushToCloud({ ...vaultData, coins: updatedCoins });
        alert(`Saved ${coinInfo.denomination} (${coinInfo.year}) to ${coinInfo.countryName}!`);
      };

      const handleNavigateToCoinOnMap = (coin) => {
        if (coin.isHistorical) {
          const matchedEntity = (vaultData.historicalEntities || []).find(e => e.id === coin.entityId);
          if (matchedEntity) {
            setScrubberYear(matchedEntity.startYear);
            setView("historical");
            const coords = matchedEntity.mint?.coords || matchedEntity.polygons?.[0]?.points?.[0];
            if (coords) setMapFocusTarget({ coords: coords, zoomLevel: 25 });
          } else {
            setView("historical");
          }
        } else {
          const sov = SOVEREIGN_LIST.find(s => s.a3 === coin.countryCode);
          const ter = TERRITORIES_LIST.find(t => t.code === coin.countryCode);
          const coords = sov ? sov.coords : (ter ? ter.coords : [15, 50]);
          setView("map");
          setMapFocusTarget({ coords: coords, zoomLevel: 14 });

      return (
        <div className="flex flex-col h-screen max-w-lg mx-auto md:max-w-5xl bg-[#05070d] border-x border-slate-800">
          
          <header className="p-3 bg-[#0a0e1a] border-b border-slate-800 flex items-center justify-between">
            <div>
              <h1 className="text-sm font-black tracking-wider text-white flex items-center gap-1.5">
                <span className="w-2.5 h-2.5 rounded-full bg-[#00f0ff] shadow-[0_0_8px_#00f0ff]"></span>
                <span>MISHA’S <span className="text-[#00f0ff]">COIN VAULT</span></span>
                <span className="text-[9px] bg-slate-800 text-slate-400 font-mono px-1.5 py-0.5 rounded border border-slate-700/60 ml-1">est. 2013</span>
              </h1>
              <div className="flex items-center gap-1.5 text-[10px] text-slate-400">
                {cloudStatus === "saving" && <span className="text-cyan-400 animate-pulse font-bold">• Saving to Cloud...</span>}
                {cloudStatus === "saved" && <span className="text-emerald-400 font-bold">✓ Saved to Cloud</span>}
                {cloudStatus === "error" && <span className="text-red-400 font-bold">✕ Sync Warning</span>}
                {cloudStatus === "idle" && <span>Live Cloud Linked</span>}

            </div>

            <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
              <button 
                onClick={() => setView("map")} 
                className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${view === "map" ? "bg-[#00f0ff] text-black shadow-md" : "text-slate-400"}`}>
                Map
              </button>
              <button

                className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${view === "vault" ? "bg-[#00f0ff] text-black shadow-md" : "text-slate-400"}`}>
                Vault ({(vaultData.coins || []).length})
              </button>
              <button 
                onClick={() => setView("historical")} 
                className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${view === "historical" ? "bg-amber-400 text-black shadow-md" : "text-amber-400/70"}`}>
                History
              </button>
            </div>
          </header>

          {view !== "historical" && (
            <div className="bg-[#080b14] px-4 py-2 border-b border-slate-800">
              <div className="flex items-center justify-between text-xs mb-1 font-semibold">
                <span className="text-emerald-400 flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-[#39ff14] shadow-[0_0_6px_#39ff14]"></span>
                  {sovereignCount} / 195 Sovereign States
                </span>
                <span className="text-emerald-400 font-mono">{sovereignPercent}%</span>
              </div>
              
              <div className="w-full bg-[#121624] h-2 rounded-full overflow-hidden border border-slate-800">
                <div 
                  className="bg-[#39ff14] h-full shadow-[0_0_10px_#39ff14] transition-all duration-500" 
                  style={{ width: `${sovereignPercent}%` }}>
                </div>
              </div>

              <div className="flex items-center justify-between pt-1.5">
                <button 
                  onClick={() => setShowTerritories(!showTerritories)}
                  className="text-[11px] text-slate-400 hover:text-white flex items-center gap-1">
                  <span>Territories & Dependencies ({TERRITORIES_LIST.length})</span>
                  <span className={`text-[9px] transform transition-transform ${showTerritories ? "rotate-180" : ""}`}>▼</span>
                </button>
                <span className="text-[10px] text-slate-500 font-mono">Red Diagonal Striped</span>
              </div>

              {showTerritories && (
                <div className="mt-2 pt-2 border-t border-slate-800 flex gap-1.5 overflow-x-auto hide-scrollbar pb-1">
                  {TERRITORIES_LIST.map(t => (
                    <button
                      key={t.code}
                      onClick={() => {
                        setSelectedCountry({ a3: t.code, name: t.name, a2: t.a2, isTerritory: true, mother: t.mother, coords: t.coords });
                        setIsModalOpen(true);
                      }}
                      className="px-2 py-1 rounded-lg text-[10px] whitespace-nowrap font-medium border bg-[#101424] border-slate-800 text-slate-300 flex items-center gap-1.5">
                      <span>{getFlagEmoji(t.a2)}</span>
                      <span>{t.name} ({t.mother})</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
          )}

          {view === "historical" && (
            <div className="bg-[#080b14] px-4 py-2 border-b border-slate-800 flex items-center gap-3">
              <span className="text-xs font-bold text-amber-400 font-mono w-20 text-center bg-slate-900 px-2 py-0.5 rounded border border-slate-800">
                {formatYearDisplay(scrubberYear)}
              </span>
              <input 
                type="range" 
                min="-3000" 
                max="2026" 
                step="5" 
                value={scrubberYear} 
                onChange={e => setScrubberYear(parseInt(e.target.value))}
                className="flex-1 accent-amber-400 h-1.5 bg-slate-800 rounded-lg cursor-pointer"
              />
              <span className="text-[10px] text-slate-400 font-semibold hidden sm:inline">Timeline Era</span>
            </div>
          )}

          <main className="flex-1 overflow-hidden relative flex flex-col">
            {view === "map" && (
              <div className="flex flex-col h-full">
                {/* Upper Map Area */}
                <div className="h-[48vh] sm:h-[55vh] relative border-b border-slate-800/80 bg-[#05070d]">
                  <InteractiveWorldMap 
                    coins={vaultData.coins || []}
                    focusTarget={mapFocusTarget}
                    onSelectModernCountry={(info) => {
                      setSelectedCountry(info);
                      setEditingCoin(null);
                      setIsModalOpen(true);
                    }}
                  />
                </div>

                {/* Bottom Interactive Vault Dashboard */}
                <div className="flex-1 p-3.5 overflow-y-auto hide-scrollbar bg-[#080b14] space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-xs font-bold text-white uppercase tracking-wider flex items-center gap-1.5">
                        <span className="w-2 h-2 rounded-full bg-[#00f0ff]"></span>
                        <span>Collection Feed</span>
                      </h2>
                      <p className="text-[10px] text-slate-400">Tap any coin below to locate on map</p>
                    </div>
                    <button 
                      onClick={() => { setSelectedCountry(null); setEditingCoin(null); setIsModalOpen(true); }}
                      className="bg-[#00f0ff] hover:bg-cyan-400 text-black font-extrabold text-[11px] px-2.5 py-1 rounded-xl shadow">
                      + Quick Add
                    </button>
                  </div>

                  {/* Horizontal Feed of Coins */}
                  <div className="flex gap-2.5 overflow-x-auto hide-scrollbar pb-1">
                    {(vaultData.coins || []).slice(0, 10).map(coin => {
                      const sov = SOVEREIGN_LIST.find(s => s.a3 === coin.countryCode);
                      const ter = TERRITORIES_LIST.find(t => t.code === coin.countryCode);
                      const flag = getFlagEmoji(sov?.a2 || ter?.a2);

                      return (
                        <div 
                          key={coin.id}
                          onClick={() => handleNavigateToCoinOnMap(coin)}
                          className="min-w-[140px] max-w-[150px] p-2.5 bg-[#0f1424] border border-slate-800 hover:border-cyan-400/60 rounded-2xl cursor-pointer transition-all active:scale-95 flex flex-col justify-between space-y-1.5 shadow-md">
                          <div>
                            <div className="flex items-center justify-between text-base">
                              <span>{coin.isHistorical ? "🏛️" : flag}</span>
                              <span className="text-[9px] bg-slate-800 text-slate-300 font-mono px-1 rounded">{coin.grade || "UNC"}</span>
                            </div>
                            <h3 className="text-xs font-bold text-white truncate mt-1">{coin.countryName}</h3>
                            <p className="text-[11px] text-[#00f0ff] font-semibold truncate">{coin.denomination}</p>
                          </div>
                          <div className="text-[10px] text-slate-400 flex justify-between items-center pt-1 border-t border-slate-800/60 font-mono">
                            <span>{formatYearDisplay(coin.year)}</span>
                            <span className="text-cyan-400 text-[10px]">🗺️</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* Mini Stats Bar */}
                  <div className="grid grid-cols-3 gap-2 pt-1">
                    <div className="bg-[#0e1424] border border-slate-800/80 p-2 rounded-xl text-center">
                      <div className="text-[10px] text-slate-400">Total Coins</div>
                      <div className="text-sm font-black text-white">{(vaultData.coins || []).length}</div>
                    </div>
                    <div className="bg-[#0e1424] border border-slate-800/80 p-2 rounded-xl text-center">
                      <div className="text-[10px] text-slate-400">Sovereign</div>
                      <div className="text-sm font-black text-[#39ff14]">{sovereignCount}/195</div>
                    </div>
                    <div className="bg-[#0e1424] border border-slate-800/80 p-2 rounded-xl text-center">
                      <div className="text-[10px] text-slate-400">Empires</div>
                      <div className="text-sm font-black text-amber-400">{(vaultData.historicalEntities || []).length}</div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {view === "vault" && (
              <CollectionVault 
                coins={vaultData.coins || []} 
                historicalEntities={vaultData.historicalEntities || []}
                onDeleteCoin={handleDeleteCoin}
                onEditCoin={(c) => {
                  setEditingCoin(c);
                  setSelectedCountry({ a3: c.countryCode, name: c.countryName });
                  setIsModalOpen(true);
                }}
                onNavigateToCoin={handleNavigateToCoinOnMap}
                onAddClick={() => {
                  setEditingCoin(null);
                  setSelectedCountry(null);
                  setIsModalOpen(true);
                }}
              />
            )}

            {view === "historical" && (
              <HistoricalStudio 
                entities={vaultData.historicalEntities || []}
                coins={vaultData.coins || []}
                scrubberYear={scrubberYear}
                focusTarget={mapFocusTarget}
                onSaveEntity={handleSaveHistoricalEntity}
                onAddHistoricalCoin={handleAddHistoricalCoin}
              />
            )}
          </main>

          {isModalOpen && (
            <AddEditCoinModal 
              initialCountry={selectedCountry}
              editingCoin={editingCoin}
              onClose={() => { setIsModalOpen(false); setEditingCoin(null); }}
              onSave={handleSaveCoin}
            />
          )}

        </div>
      );
    }

    function InteractiveWorldMap({ coins, focusTarget, onSelectModernCountry }) {
      const svgRef = useRef(null);
      const zoomBehaviorRef = useRef(null);
      const projectionRef = useRef(d3.geoNaturalEarth1().scale(150).translate([400, 240]));

      const statusMap = useMemo(() => {
        const map = {};
        coins.forEach(c => {
          if (c.isHistorical) return;
          let targets = [c.countryCode];
          if (WEST_AFRICAN_CFA.includes(c.countryCode) && c.isUnion) targets = WEST_AFRICAN_CFA;
          if (EASTERN_CARIBBEAN.includes(c.countryCode) && c.isUnion) targets = EASTERN_CARIBBEAN;

          targets.forEach(code => {
            if (!map[code]) map[code] = { collected: true, neonColor: c.neonColor, abroadOnly: !c.inPossession };
            else if (c.inPossession) map[code].abroadOnly = false;
          });
        });
        return map;
      }, [coins]);

      useEffect(() => {
        const width = 800;
        const height = 480;
        const svg = d3.select(svgRef.current);
        svg.selectAll("*").remove();

        const defs = svg.append("defs");
        const hatch = defs.append("pattern")
          .attr("id", "diagonalHatchRed")
          .attr("width", 8).attr("height", 8)
          .attr("patternTransform", "rotate(45 0 0)").attr("patternUnits", "userSpaceOnUse");
        hatch.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 8)
          .attr("stroke", "#ff1744").attr("stroke-width", 2.5);

        const g = svg.append("g").attr("id", "modern-map-root");
        const projection = projectionRef.current;
        const path = d3.geoPath().projection(projection);

        const zoom = d3.zoom().scaleExtent([1, 250]).on("zoom", (e) => g.attr("transform", e.transform));
        zoomBehaviorRef.current = zoom;
        svg.call(zoom);

        Promise.all([
          d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
          d3.tsv("https://unpkg.com/world-atlas@1.1.4/world/110m.tsv")
        ]).then(([atlasData, tsvData]) => {
          const nameMap = {};
          tsvData.forEach(d => { 
            nameMap[d.iso_n3] = { a3: d.iso_a3, name: d.name }; 
          });
          nameMap["728"] = { a3: "SSD", name: "South Sudan" };

          const countries = topojson.feature(atlasData, atlasData.objects.countries).features;

          g.selectAll("path")
            .data(countries)
            .enter().append("path")
            .attr("d", path)
            .attr("class", d => {
              const info = nameMap[d.id];
              const code = info ? info.a3 : null;
              const st = code ? statusMap[code] : null;
              if (!st) return "fill-[#0f1320] stroke-[#1b233a] stroke-[0.35] hover:fill-[#182035] cursor-pointer";
              return `neon-${st.neonColor} cursor-pointer ${st.abroadOnly ? "border-red-glow" : "stroke-white/30 stroke-[0.35]"}`;
            })
            .on("click", (e, d) => {
              const baseInfo = nameMap[d.id] || { a3: "WLD", name: "Selected Territory" };
              const match = SOVEREIGN_LIST.find(s => s.a3 === baseInfo.a3);
              onSelectModernCountry(match || baseInfo);
            });

          g.selectAll(".micro-pin")
            .data(MICRO_STATES)
            .enter().append("circle")
            .attr("cx", d => projection(d.coords)[0])
            .attr("cy", d => projection(d.coords)[1])
            .attr("r", 2.6)
            .attr("class", d => {
              const st = statusMap[d.a3];
              if (!st) return "fill-[#242e44] stroke-cyan-400/60 hover:fill-[#00f0ff] cursor-pointer";
              return `neon-${st.neonColor} ${st.abroadOnly ? "border-red-glow stroke-[1.2]" : "stroke-white/70"}`;
            })
            .on("click", (e, d) => onSelectModernCountry({ a3: d.a3, name: d.name, a2: d.a2 }));

          g.selectAll(".territory-pin")
            .data(TERRITORIES_LIST)
            .enter().append("circle")
            .attr("cx", d => projection(d.coords)[0])
            .attr("cy", d => projection(d.coords)[1])
            .attr("r", 3)
            .attr("fill", "url(#diagonalHatchRed)")
            .attr("stroke", "#ff1744")
            .attr("stroke-width", 0.8)
            .attr("class", "cursor-pointer")
            .on("click", (e, d) => onSelectModernCountry({ a3: d.code, name: d.name, a2: d.a2, isTerritory: true, mother: d.mother }));
        });
      }, [statusMap]);

      useEffect(() => {
        if (!focusTarget || !svgRef.current || !zoomBehaviorRef.current) return;
        const [x, y] = projectionRef.current(focusTarget.coords);
        const k = focusTarget.zoomLevel || 12;
        const transform = d3.zoomIdentity.translate(400 - x * k, 240 - y * k).scale(k);
        d3.select(svgRef.current).transition().duration(900).call(zoomBehaviorRef.current.transform, transform);
      }, [focusTarget]);

      return (
        <div className="w-full h-full bg-[#05070d] flex items-center justify-center overflow-hidden">
          <svg ref={svgRef} viewBox="0 0 800 480" className="w-full h-full object-contain"></svg>
        </div>
      );
    }

    function HistoricalStudio({ entities, coins, scrubberYear, focusTarget, onSaveEntity, onAddHistoricalCoin }) {
      const svgRef = useRef(null);
      const [isVertexMode, setIsVertexMode] = useState(false);
      const isVertexModeRef = useRef(false);

      const [currentVertices, setCurrentVertices] = useState([]);
      const currentVerticesRef = useRef([]);

      const [closedPolygons, setClosedPolygons] = useState([]);
      const [inspectingEntity, setInspectingEntity] = useState(null);

      const [colorPaletteModalEntity, setColorPaletteModalEntity] = useState(null);
      const [tempColor, setTempColor] = useState("#ffd600");
      const [tempStriped, setTempStriped] = useState(false);

      const [isAddingCoinForEntity, setIsAddingCoinForEntity] = useState(null);
      const [historicalCoinForm, setHistoricalCoinForm] = useState({
        denomination: "",
        year: "",
        ruler: "",
        mint: "",
        grade: "VF",
        notes: ""
      });

      const [placingMint, setPlacingMint] = useState(false);
      const placingMintRef = useRef(false);
      const [mintCandidate, setMintCandidate] = useState(null);
      const [mintCandidateCountry, setMintCandidateCountry] = useState("");
      const [confirmedMint, setConfirmedMint] = useState(null);

      const [metaModalOpen, setMetaModalOpen] = useState(false);
      const [entityMeta, setEntityMeta] = useState({
        id: "",
        name: "Polish - Lithuanian Commonwealth",
        ruler: "Sigismund III Vasa",
        startYear: "1588",
        endYear: "1621",
        mintCity: "Vilnius / Kraków",
        bgColor: "#ffd600",
        striped: false
      });

      const projectionRef = useRef(d3.geoNaturalEarth1().scale(150).translate([400, 250]));
      const worldGeoRef = useRef(null);
      const currentTransformRef = useRef(d3.zoomIdentity);
      const zoomBehaviorRef = useRef(null);

      useEffect(() => { isVertexModeRef.current = isVertexMode; }, [isVertexMode]);
      useEffect(() => { currentVerticesRef.current = currentVertices; }, [currentVertices]);
      useEffect(() => { placingMintRef.current = placingMint; }, [placingMint]);

      useEffect(() => {
        const svgEl = svgRef.current;
        const svg = d3.select(svgEl);
        svg.selectAll("*").remove();

        const defs = svg.append("defs");

        entities.forEach(ent => {
          (ent.polygons || []).forEach((poly, idx) => {
            if (poly.striped) {
              const pat = defs.append("pattern")
                .attr("id", `stripe-pat-${ent.id}-${idx}`)
                .attr("width", 8).attr("height", 8)
                .attr("patternTransform", "rotate(45 0 0)")
                .attr("patternUnits", "userSpaceOnUse");
              pat.append("rect").attr("width", 8).attr("height", 8).attr("fill", poly.bgColor || "#111625");
              pat.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 8)
                .attr("stroke", poly.stripeColor || "#ff1744").attr("stroke-width", 2.5);
            }
          });
        });

        const gRoot = svg.append("g").attr("id", "studio-root");
        const gBase = gRoot.append("g").attr("id", "layer-base");
        const gClippedEmpires = gRoot.append("g")
          .attr("id", "layer-clipped-empires")
          .attr("clip-path", "url(#world-land-clip)");

        const gBorders = gRoot.append("g").attr("id", "layer-borders");
        const gActiveDraw = gRoot.append("g").attr("id", "layer-active-draw");

        const path = d3.geoPath().projection(projectionRef.current);

        const zoom = d3.zoom()
          .scaleExtent([1, 250])
          .filter((event) => {
            if ((isVertexModeRef.current || placingMintRef.current) && event.type === 'touchstart' && event.touches.length === 1) return false;
            if ((isVertexModeRef.current || placingMintRef.current) && event.type === 'mousedown') return false;
            return true;
          })
          .on("zoom", (e) => {
            currentTransformRef.current = e.transform;
            gRoot.attr("transform", e.transform);
            updateDynamicOverlay();
          });

        zoomBehaviorRef.current = zoom;
        svg.call(zoom);

        Promise.all([
          d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
          d3.tsv("https://unpkg.com/world-atlas@1.1.4/world/110m.tsv")
        ]).then(([atlasData, tsvData]) => {
          const land = topojson.feature(atlasData, atlasData.objects.land);
          const countries = topojson.feature(atlasData, atlasData.objects.countries).features;
          worldGeoRef.current = { features: countries, tsv: tsvData, land: land };

          const clipPath = defs.append("clipPath").attr("id", "world-land-clip");
          clipPath.append("path").datum(land).attr("d", path);

          gBase.append("path")
            .datum(land)
            .attr("d", path)
            .attr("fill", "#0c1120");

          gBorders.selectAll(".ghost-country")
            .data(countries)
            .enter().append("path")
            .attr("d", path)
            .attr("fill", "transparent")
            .attr("stroke", "#192238")
            .attr("stroke-width", 0.4);

          updateDynamicOverlay();
        });

        const handlePointerClick = (e) => {
          const gRootNode = d3.select("#studio-root").node();
          if (!gRootNode) return;

          const [transformedX, transformedY] = d3.pointer(e, gRootNode);
          const coords = projectionRef.current.invert([transformedX, transformedY]);
          if (!coords || isNaN(coords[0]) || isNaN(coords[1])) return;

          if (placingMintRef.current) {
            setMintCandidate(coords);
            setMintCandidateCountry(detectCountry(coords));
            return;
          }

          if (isVertexModeRef.current) {
            setCurrentVertices(prev => [...prev, coords]);
          }
        };

        svgEl.addEventListener("click", handlePointerClick);
        return () => svgEl.removeEventListener("click", handlePointerClick);

      }, [closedPolygons, entities]);

      const updateDynamicOverlay = () => {
        const k = currentTransformRef.current ? currentTransformRef.current.k : 1;
        const dotRadius = Math.max(0.6, 2.5 / k);
        const strokeW = Math.max(0.3, 1.2 / k);

        const visibleEntities = (entities || []).filter(e => scrubberYear >= e.startYear && scrubberYear <= e.endYear);
        const isCurrentActiveInScrubber = (parseInt(entityMeta.startYear) <= scrubberYear && parseInt(entityMeta.endYear) >= scrubberYear);

        const gClipped = d3.select("#layer-clipped-empires");
        if (!gClipped.empty()) {
          gClipped.selectAll("*").remove();

          visibleEntities.forEach(ent => {
            const gEnt = gClipped.append("g")
              .attr("class", "cursor-pointer")
              .on("click", (evt) => {
                evt.stopPropagation();
                setInspectingEntity(ent);
              });

            (ent.polygons || []).forEach((poly, idx) => {
              const pts = poly.points.map(p => projectionRef.current(p));
              const d = d3.line().curve(d3.curveLinearClosed)(pts);
              gEnt.append("path")
                .attr("d", d)
                .attr("fill", poly.striped ? `url(#stripe-pat-${ent.id}-${idx})` : (poly.bgColor || "#00f0ff"))
                .attr("fill-opacity", 0.65)
                .attr("stroke", poly.bgColor || "#00f0ff")
                .attr("stroke-width", Math.max(0.4, 1.4 / k));
            });
          });

          if (isCurrentActiveInScrubber) {
            closedPolygons.forEach((poly, idx) => {
              const pts = poly.points.map(p => projectionRef.current(p));
              const d = d3.line().curve(d3.curveLinearClosed)(pts);
              gClipped.append("path")
                .attr("d", d)
                .attr("fill", poly.bgColor || entityMeta.bgColor || "#ffd600")
                .attr("fill-opacity", 0.7)
                .attr("stroke", poly.bgColor || entityMeta.bgColor || "#ffd600")
                .attr("stroke-width", Math.max(0.5, 1.5 / k));
            });
          }
        }

        const gActive = d3.select("#layer-active-draw");
        if (!gActive.empty()) {
          gActive.selectAll("*").remove();

          visibleEntities.forEach(ent => {
            if (ent.mint && ent.mint.coords) {
              const [mx, my] = projectionRef.current(ent.mint.coords);
              const gMint = gActive.append("g")
                .attr("transform", `translate(${mx}, ${my})`)
                .attr("class", "cursor-pointer")
                .on("click", (evt) => {
                  evt.stopPropagation();
                  setInspectingEntity(ent);
                });
              gMint.append("circle").attr("r", 4.5 / k).attr("fill", "#ff1744");
              gMint.append("circle").attr("r", 1.8 / k).attr("fill", "#ffffff");
            }
          });

          if (currentVertices.length > 0) {
            const pts = currentVertices.map(p => projectionRef.current(p));
            gActive.append("path")
              .attr("d", d3.line()(pts))
              .attr("fill", "none")
              .attr("stroke", "#39ff14")
              .attr("stroke-width", Math.max(0.6, 1.6 / k))
              .attr("stroke-dasharray", `${3.5 / k},${3.5 / k}`);

            currentVertices.forEach((p, idx) => {
              const [cx, cy] = projectionRef.current(p);
              gActive.append("circle")
                .attr("cx", cx)
                .attr("cy", cy)
                .attr("r", dotRadius)
                .attr("fill", idx === 0 ? "#ff007f" : "#39ff14")
                .attr("stroke", "#ffffff")
                .attr("stroke-width", strokeW);
            });
          }

          if (mintCandidate) {
            const [cx, cy] = projectionRef.current(mintCandidate);
            const gCandidate = gActive.append("g").attr("transform", `translate(${cx}, ${cy})`);
            gCandidate.append("circle").attr("r", 6.5 / k).attr("fill", "none").attr("stroke", "#ff1744").attr("stroke-width", 1.5 / k);
            gCandidate.append("circle").attr("r", 3.5 / k).attr("fill", "#ff1744");
            gCandidate.append("circle").attr("r", 1.2 / k).attr("fill", "#ffffff");
          }

          if (confirmedMint && !mintCandidate && isCurrentActiveInScrubber) {
            const [cx, cy] = projectionRef.current(confirmedMint.coords);
            const gPin = gActive.append("g").attr("transform", `translate(${cx}, ${cy})`);
            gPin.append("circle").attr("r", 5 / k).attr("fill", "#ff1744");
            gPin.append("circle").attr("r", 1.8 / k).attr("fill", "#ffffff");
          }
        }
      };

      useEffect(() => {
        updateDynamicOverlay();
      }, [entities, scrubberYear, closedPolygons, currentVertices, mintCandidate, confirmedMint, entityMeta]);

      useEffect(() => {
        if (!focusTarget || !svgRef.current || !zoomBehaviorRef.current) return;
        const [x, y] = projectionRef.current(focusTarget.coords);
        const k = focusTarget.zoomLevel || 18;
        const transform = d3.zoomIdentity.translate(400 - x * k, 250 - y * k).scale(k);
        d3.select(svgRef.current).transition().duration(900).call(zoomBehaviorRef.current.transform, transform);
      }, [focusTarget]);

      const detectCountry = (coords) => {
        if (!worldGeoRef.current || !coords) return "Coastal / Ocean Waters";
        const found = worldGeoRef.current.features.find(feature => d3.geoContains(feature, coords));
        if (found) {
          const item = worldGeoRef.current.tsv.find(t => t.iso_n3 === found.id);
          return item ? item.name : "Sovereign Territory";
        }
        return "Coastal Waters";
      };

      const getCountriesInsideEmpire = (entity) => {
        if (!entity?.polygons || entity.polygons.length === 0) return [];
        const polyGeoPoints = entity.polygons[0].points;
        const projectedPoly = polyGeoPoints.map(p => projectionRef.current(p));
        const matched = [];

        SOVEREIGN_LIST.forEach(nation => {
          const projCenter = projectionRef.current(nation.coords);
          if (d3.polygonContains(projectedPoly, projCenter)) {
            matched.push(nation);
            return;
          }
          const hasNearbyVertex = polyGeoPoints.some(gp => {
            const dx = gp[0] - nation.coords[0];
            const dy = gp[1] - nation.coords[1];
            return (dx * dx + dy * dy) < 18;
          });
          if (hasNearbyVertex) {
            matched.push(nation);
          }
        });

        return matched;
      };

      const handleCompletePolygon = () => {
        if (currentVertices.length < 3) {
          alert("Place at least 3 points to create a closed boundary.");
          return;
        }

        const newPoly = {
          points: currentVertices,
          bgColor: entityMeta.bgColor || "#ffd600",
          striped: entityMeta.striped || false,
          stripeColor: "#ff1744"
        };

        setClosedPolygons(prev => [...prev, newPoly]);
        setCurrentVertices([]);
        setIsVertexMode(false);
      };

      const handleSaveCompleteEntity = () => {
        if (!entityMeta.name) {
          alert("Please enter a name for the entity.");
          return;
        }

        const fullEntity = {
          id: entityMeta.id || Date.now().toString(),
          name: entityMeta.name,
          ruler: entityMeta.ruler,
          startYear: parseInt(entityMeta.startYear) || -500,
          endYear: parseInt(entityMeta.endYear) || 2026,
          polygons: closedPolygons.map(p => ({ ...p, bgColor: entityMeta.bgColor, striped: entityMeta.striped })),
          mint: confirmedMint ? {
            city: entityMeta.mintCity,
            country: confirmedMint.country,
            coords: confirmedMint.coords
          } : null
        };

        onSaveEntity(fullEntity);
        setClosedPolygons([]);
        setConfirmedMint(null);
        alert(`Saved ${entityMeta.name} to Historical Vault!`);
      };

      const handleZoomStep = (direction) => {
        if (!svgRef.current || !zoomBehaviorRef.current) return;
        d3.select(svgRef.current).transition().duration(250).call(
          zoomBehaviorRef.current.scaleBy,
          direction === "in" ? 1.8 : 0.55
        );
      };

      const handleConfirmColorChange = () => {
        if (!colorPaletteModalEntity) return;
        const updated = {
          ...colorPaletteModalEntity,
          polygons: (colorPaletteModalEntity.polygons || []).map(p => ({
            ...p,
            bgColor: tempColor,
            striped: tempStriped
          }))
        };
        onSaveEntity(updated);
        if (inspectingEntity?.id === updated.id) setInspectingEntity(updated);
        setColorPaletteModalEntity(null);
      };

      const activeTimelineEntities = useMemo(() => {
        return (entities || []).find(e => scrubberYear >= e.startYear && scrubberYear <= e.endYear);
      }, [entities, scrubberYear]);

      const coinsForInspectedEntity = useMemo(() => {
        if (!inspectingEntity) return [];
        return (coins || []).filter(c => c.entityId === inspectingEntity.id);
      }, [coins, inspectingEntity]);

      const modernNationsInEmpire = useMemo(() => {
        if (!inspectingEntity) return [];
        return getCountriesInsideEmpire(inspectingEntity);
      }, [inspectingEntity, entities]);

      return (
        <div className="relative w-full h-full bg-[#05070d] overflow-hidden flex flex-col select-none">

          <svg 
            ref={svgRef} 
            viewBox="0 0 800 480" 
            className="w-full h-full object-contain map-canvas-touch">
          </svg>

          <div className="absolute top-3 left-3 z-20 flex gap-2">
            <button 
              onClick={() => setMetaModalOpen(true)}
              className="bg-[#0b101eee] border border-amber-400/60 text-amber-400 hover:text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-lg backdrop-blur-md flex items-center gap-1.5">
              <span>🏛</span>
              <span>{closedPolygons.length > 0 ? "Edit Empire Specs" : "New Empire Setup"}</span>
            </button>
            {closedPolygons.length > 0 && (
              <button 
                onClick={handleSaveCompleteEntity}
                className="bg-amber-400 text-black px-3.5 py-1.5 rounded-xl text-xs font-black shadow-lg hover:bg-amber-300">
                Save Empire
              </button>
            )}
          </div>

          <div className="absolute right-3 top-3 z-30 flex flex-col gap-1.5">
            <button 
              onClick={() => handleZoomStep("in")} 
              className="w-8 h-8 rounded-lg bg-[#0e1424]/90 border border-slate-700 text-white font-black text-base shadow-lg flex items-center justify-center active:scale-95">
              +
            </button>
            <button 
              onClick={() => handleZoomStep("out")} 
              className="w-8 h-8 rounded-lg bg-[#0e1424]/90 border border-slate-700 text-white font-black text-base shadow-lg flex items-center justify-center active:scale-95">
              −
            </button>
          </div>

          {activeTimelineEntities && (
            <div className="absolute bottom-24 inset-x-4 z-20 flex justify-center pointer-events-none">
              <div className="pointer-events-auto bg-[#0b101eee] border border-amber-400/50 backdrop-blur-md px-3.5 py-2 rounded-2xl shadow-2xl flex items-center gap-3">
                <div 
                  onClick={() => {
                    setColorPaletteModalEntity(activeTimelineEntities);
                    setTempColor(activeTimelineEntities.polygons?.[0]?.bgColor || "#ffd600");
                    setTempStriped(activeTimelineEntities.polygons?.[0]?.striped || false);
                  }}
                  className="w-4 h-4 rounded-full cursor-pointer hover:scale-125 transition-transform border border-white/60 shadow-[0_0_8px_rgba(251,191,36,0.8)]"
                  style={{ backgroundColor: activeTimelineEntities.polygons?.[0]?.bgColor || "#ffaa00" }}
                  title="Click to change color">
                </div>
                
                <div onClick={() => setInspectingEntity(activeTimelineEntities)} className="cursor-pointer">
                  <div className="text-xs font-black text-white flex items-center gap-1.5">
                    <span>{activeTimelineEntities.name}</span>
                    <span className="text-[10px] text-amber-400">ⓘ</span>
                  </div>
                  <div className="text-[10px] text-slate-400">
                    {activeTimelineEntities.ruler} ({formatYearDisplay(activeTimelineEntities.startYear)} – {formatYearDisplay(activeTimelineEntities.endYear)})
                  </div>
                </div>

                <div className="flex items-center gap-1 border-l border-slate-800 pl-2">
                  <button 
                    onClick={() => {
                      setColorPaletteModalEntity(activeTimelineEntities);
                      setTempColor(activeTimelineEntities.polygons?.[0]?.bgColor || "#ffd600");
                      setTempStriped(activeTimelineEntities.polygons?.[0]?.striped || false);
                    }}
                    className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-[10px] font-bold px-2 py-1 rounded-lg">
                    🎨 Color
                  </button>
                  <button 
                    onClick={() => setIsAddingCoinForEntity(activeTimelineEntities)}
                    className="bg-cyan-500 hover:bg-cyan-400 text-black text-[10px] font-black px-2 py-1 rounded-lg">
                    + Coin
                  </button>
                </div>
              </div>
            </div>
          )}

          <div className="absolute bottom-9 sm:bottom-8 inset-x-3 z-30 flex items-center justify-between pointer-events-none">
            <div className="pointer-events-auto">
              <button 
                onClick={() => { setPlacingMint(!placingMint); setIsVertexMode(false); }}
                className={`px-3 py-2.5 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-xl ${placingMint ? "bg-red-500 text-white animate-pulse" : "bg-[#101526] border border-slate-700 text-slate-200"}`}>
                <span>📍</span>
                <span>{confirmedMint ? "Mint Placed" : "Place Mint"}</span>
              </button>
            </div>

            <div className="pointer-events-auto flex items-center gap-2">
              {isVertexMode && currentVertices.length >= 3 && (
                <button 
                  onClick={handleCompletePolygon}
                  className="bg-emerald-500 hover:bg-emerald-400 text-black font-black px-3.5 py-2.5 rounded-xl text-xs shadow-lg">
                  ✓ Close Shape ({currentVertices.length} pts)
                </button>
              )}

              {isVertexMode && currentVertices.length > 0 && (
                <button 
                  onClick={() => setCurrentVertices(prev => prev.slice(0, -1))}
                  className="bg-slate-800 text-slate-300 font-bold px-2.5 py-2.5 rounded-xl text-xs border border-slate-700">
                  Undo Pt
                </button>
              )}

              <button 
                onClick={() => { setIsVertexMode(!isVertexMode); setPlacingMint(false); }}
                className={`px-4 py-2.5 rounded-xl text-xs font-black flex items-center gap-1.5 shadow-xl transition-all ${isVertexMode ? "bg-[#39ff14] text-black ring-4 ring-[#39ff14]/30" : "bg-amber-400 text-black"}`}>
                <span>📍</span>
                <span>{isVertexMode ? "Tap Map to Add Dots" : "Start Boundary"}</span>
              </button>
            </div>
          </div>

          {placingMint && mintCandidate && (
            <div className="absolute bottom-24 inset-x-4 z-40 bg-[#0c1222f6] border border-red-500/60 p-3 rounded-2xl shadow-2xl backdrop-blur-md flex items-center justify-between">
              <div>
                <div className="text-xs font-bold text-white">Place Mint Here?</div>
                <div className="text-[10px] text-slate-400">Detected: <span className="text-red-400 font-semibold">{mintCandidateCountry}</span></div>
              </div>
              <div className="flex gap-2">
                <button 
                  onClick={() => setMintCandidate(null)} 
                  className="px-2.5 py-1 bg-slate-800 text-slate-300 text-xs rounded-lg font-bold">
                  Cancel
                </button>
                <button 
                  onClick={() => {
                    setConfirmedMint({ coords: mintCandidate, country: mintCandidateCountry });
                    setMintCandidate(null);
                    setPlacingMint(false);
                  }} 
                  className="px-3 py-1 bg-red-600 hover:bg-red-500 text-white text-xs rounded-lg font-extrabold shadow-md">
                  Confirm
                </button>
              </div>
            </div>
          )}

          {metaModalOpen && (

    function CollectionVault({ coins, historicalEntities, onDeleteCoin, onEditCoin, onNavigateToCoin, onAddClick }) {
      const [query, setQuery] = useState("");
      const [vaultMode, setVaultMode] = useState("all");

      const filtered = useMemo(() => {
        return coins.filter(c => {
          if (vaultMode === "sovereign" && c.isHistorical) return false;
          if (vaultMode === "historical" && !c.isHistorical) return false;

          const searchTarget = `${c.countryName} ${c.denomination} ${c.mint || ""} ${c.ruler || ""} ${c.year || ""}`.toLowerCase();
          return searchTarget.includes(query.toLowerCase());
        });
      }, [coins, query, vaultMode]);

      return (
        <div className="flex flex-col h-full p-3.5 overflow-y-auto hide-scrollbar space-y-3">
          
          <div className="flex gap-2">
            <input 
              type="text" 
              placeholder="Search coin, empire, ruler, mint..." 
              value={query}
              onChange={e => setQuery(e.target.value)}
              className="flex-1 bg-[#101524] border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-[#00f0ff]" 
            />
            <button onClick={onAddClick} className="bg-[#00f0ff] font-bold text-black text-xs px-3 rounded-xl shadow-lg">+ Add</button>
          </div>

          <div className="flex gap-1.5 bg-[#090d18] p-1 rounded-xl border border-slate-800 text-xs">
            <button 
              onClick={() => setVaultMode("all")}
              className={`flex-1 py-1 rounded-lg font-bold ${vaultMode === "all" ? "bg-slate-800 text-white" : "text-slate-400"}`}>
              All ({coins.length})
            </button>
            <button 
              onClick={() => setVaultMode("sovereign")}
              className={`flex-1 py-1 rounded-lg font-bold ${vaultMode === "sovereign" ? "bg-cyan-500 text-black" : "text-slate-400"}`}>
              Modern ({coins.filter(c => !c.isHistorical).length})
            </button>
            <button 
              onClick={() => setVaultMode("historical")}
              className={`flex-1 py-1 rounded-lg font-bold ${vaultMode === "historical" ? "bg-amber-400 text-black" : "text-slate-400"}`}>
              Ancient & Medieval ({coins.filter(c => c.isHistorical).length})
            </button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pb-8">
            {filtered.length === 0 ? (
              <div className="col-span-full py-16 text-center text-slate-500 text-xs">
                No coins found in this category.
              </div>
            ) : (
              filtered.map(coin => {
                const sov = SOVEREIGN_LIST.find(s => s.a3 === coin.countryCode);
                const ter = TERRITORIES_LIST.find(t => t.code === coin.countryCode);
                const flag = getFlagEmoji(sov?.a2 || ter?.a2);

                return (
                  <div 
                    key={coin.id} 
                    className={`bg-[#0f1424] border rounded-2xl p-3 space-y-2 relative ${coin.isHistorical ? "border-amber-400/40" : (!coin.inPossession ? "border-[#ff1744]" : "border-slate-800")}`}>
                    
                    <div className="flex items-start justify-between">
                      <div>
                        <div className="flex items-center gap-1.5">
                          <span className="text-base">{coin.isHistorical ? "🏛️" : flag}</span>
                          {coin.isHistorical && <span className="text-[10px] bg-amber-400/10 text-amber-400 border border-amber-400/30 px-1 rounded font-semibold">Historical</span>}
                          <h3 className="font-bold text-sm text-white">{coin.countryName}</h3>
                        </div>
                        <p className={`text-[11px] font-semibold ${coin.isHistorical ? "text-amber-400" : "text-[#00f0ff]"}`}>{coin.denomination}</p>
                      </div>

                      <div className="flex items-center gap-1">
                        <button onClick={() => onEditCoin(coin)} className="text-slate-400 hover:text-white p-1 text-xs" title="Edit">✏️</button>
                        <button onClick={() => onDeleteCoin(coin.id)} className="text-slate-400 hover:text-red-400 p-1 text-xs" title="Delete">🗑</button>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-1 bg-[#080b14] p-1.5 rounded-lg text-[10px] text-slate-300">
                      <div><span className="text-slate-500">Year:</span> {formatYearDisplay(coin.year)}</div>
                      <div><span className="text-slate-500">Grade:</span> {coin.grade || "UNC"}</div>
                      <div className="truncate"><span className="text-slate-500">Mint:</span> {coin.mint || "—"}</div>
                      <div className="truncate"><span className="text-slate-500">Ruler:</span> {coin.ruler || "—"}</div>
                    </div>

                    {coin.notes && <p className="text-[10px] text-slate-400 italic">"{coin.notes}"</p>}

                    <div className="pt-1 border-t border-slate-800/80 flex justify-end">
                      <button 
                        onClick={() => onNavigateToCoin(coin)}
                        className="text-[11px] font-bold text-cyan-400 hover:text-cyan-300 flex items-center gap-1 px-2 py-0.5 rounded-lg bg-cyan-950/40 border border-cyan-800/50">
                        <span>View on Map</span>
                        <span>🗺️</span>
                      </button>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    function AddEditCoinModal({ initialCountry, editingCoin, onClose, onSave }) {
      const [formData, setFormData] = useState(() => {
        if (editingCoin) return { ...editingCoin };
        return {
          countryCode: initialCountry?.a3 || "POL",
          countryName: initialCountry?.name || "Poland",
          isTerritory: !!initialCountry?.isTerritory,
          motherCountry: initialCountry?.mother || "",
          denomination: "",
          year: "",
          ruler: "",
          mint: "",
          grade: "UNC",
          inPossession: true,
          isUnion: false,
          isHistorical: false,
          neonColor: "cyan",
          notes: ""
        };
      });

      const currentFlag = useMemo(() => {
        const sov = SOVEREIGN_LIST.find(s => s.a3 === formData.countryCode);
        const ter = TERRITORIES_LIST.find(t => t.code === formData.countryCode);
        return getFlagEmoji(sov?.a2 || ter?.a2);
      }, [formData.countryCode]);

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-[#0e1424] border border-slate-800 rounded-t-3xl sm:rounded-3xl w-full max-w-lg p-4 max-h-[90vh] overflow-y-auto hide-scrollbar space-y-3.5">
            <div className="flex items-center justify-between pb-2 border-b border-slate-800">
              <h2 className="text-xs font-bold text-white flex items-center gap-1.5">
                <span className="text-base">{currentFlag}</span>
                <span>{editingCoin ? "Edit Coin:" : "Add Coin:"}</span>
                <span className="text-[#00f0ff]">{formData.countryName}</span>
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white font-bold text-base">✕</button>
            </div>

            <form onSubmit={e => { e.preventDefault(); onSave(formData); }} className="space-y-3 text-xs">
              <div>
                <label className="text-slate-400 block mb-1">Country / Territory</label>
                <select 
                  value={formData.countryCode} 
                  onChange={e => {
                    const code = e.target.value;
                    const foundSov = SOVEREIGN_LIST.find(s => s.a3 === code);
                    const foundTer = TERRITORIES_LIST.find(t => t.code === code);
                    if (foundSov) setFormData(p => ({ ...p, countryCode: foundSov.a3, countryName: foundSov.name, isTerritory: false }));
                    if (foundTer) setFormData(p => ({ ...p, countryCode: foundTer.code, countryName: foundTer.name, isTerritory: true, motherCountry: foundTer.mother }));
                  }}
                  className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white">
                  <optgroup label="Sovereign Nations">
                    {SOVEREIGN_LIST.map(s => (
                      <option key={s.a3} value={s.a3}>
                        {getFlagEmoji(s.a2)} {s.name} ({s.a3})
                      </option>
                    ))}
                  </optgroup>
                  <optgroup label="Territories & Dependencies">
                    {TERRITORIES_LIST.map(t => (
                      <option key={t.code} value={t.code}>
                        {getFlagEmoji(t.a2)} {t.name} ({t.mother})
                      </option>
                    ))}
                  </optgroup>
                </select>
              </div>

              <div className="grid grid-cols-2 gap-2.5">
                <div>
                  <label className="text-slate-400 block mb-1">Denomination *</label>
                  <input required value={formData.denomination} onChange={e => setFormData({...formData, denomination: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">Year / Range (e.g. 1588-1621)</label>
                  <input type="text" value={formData.year} onChange={e => setFormData({...formData, year: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2.5">
                <div>
                  <label className="text-slate-400 block mb-1">Mint City / Mintmark</label>
                  <input value={formData.mint} onChange={e => setFormData({...formData, mint: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">Ruler / Head of State</label>
                  <input value={formData.ruler} onChange={e => setFormData({...formData, ruler: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
              </div>

              <div className="p-2.5 bg-[#12182b] rounded-xl border border-slate-800 flex items-center justify-between">
                <div>
                  <div className="font-semibold text-white">In Physical Possession</div>
                  <div className="text-[10px] text-slate-400">If unchecked, marked with slim red border</div>
                </div>
                <input 
                  type="checkbox" 
                  checked={formData.inPossession} 
                  onChange={e => setFormData({...formData, inPossession: e.target.checked})} 
                  className="w-5 h-5 accent-[#00f0ff]" 
                />
              </div>

              <div>
                <label className="text-slate-400 block mb-1">Notes</label>
                <input value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} placeholder="e.g. Acquired from coin fair" className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
              </div>

              <button type="submit" className="w-full py-2.5 bg-[#00f0ff] hover:bg-[#00d0df] text-black font-extrabold rounded-xl text-xs uppercase tracking-wider shadow-lg">
                Save Coin to Vault
              </button>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
