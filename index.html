    // Helper: Downscale image to lightweight 300x300 JPEG (~15-25KB)
    function downscaleBase64(dataUrl, callback) {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const maxDim = 300;
        let width = img.width;
        let height = img.height;
        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        callback(canvas.toDataURL("image/jpeg", 0.7));
      };
      img.src = dataUrl;
    }

    function InteractiveWorldMap({ coins, onSelectModernCountry }) {
      const svgRef = useRef(null);

      const statusMap = useMemo(() => {
        const map = {};
        coins.forEach(c => {
          let targets = [c.countryCode];
          if (WEST_AFRICAN_CFA.includes(c.countryCode) && c.isUnion) targets = WEST_AFRICAN_CFA;
          if (EASTERN_CARIBBEAN.includes(c.countryCode) && c.isUnion) targets = EASTERN_CARIBBEAN;

          targets.forEach(code => {
            if (!map[code]) map[code] = { collected: true, neonColor: c.neonColor || 'cyan', abroadOnly: !c.inPossession };
            else if (c.inPossession) map[code].abroadOnly = false;
          });
        });
        return map;
      }, [coins]);

      useEffect(() => {
        const width = 800;
        const height = 480;
        const svg = d3.select(svgRef.current);
        svg.selectAll("*").remove();

        const defs = svg.append("defs");
        const hatch = defs.append("pattern")
          .attr("id", "diagonalHatchRed")
          .attr("width", 8).attr("height", 8)
          .attr("patternTransform", "rotate(45 0 0)").attr("patternUnits", "userSpaceOnUse");
        hatch.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 8)
          .attr("stroke", "#ff1744").attr("stroke-width", 2.5);

        const g = svg.append("g");
        const projection = d3.geoNaturalEarth1().scale(150).translate([width / 2, height / 1.9]);
        const path = d3.geoPath().projection(projection);

        const zoom = d3.zoom().scaleExtent([1, 14]).on("zoom", (e) => g.attr("transform", e.transform));
        svg.call(zoom);

        Promise.all([
          d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
          d3.tsv("https://unpkg.com/world-atlas@1.1.4/world/110m.tsv")
        ]).then(([atlasData, tsvData]) => {
          const nameMap = {};
          tsvData.forEach(d => { nameMap[d.iso_n3] = { a3: d.iso_a3, name: d.name }; });
          nameMap["728"] = { a3: "SSD", name: "South Sudan" };
          nameMap["798"] = { a3: "TUV", name: "Tuvalu" };

          const countries = topojson.feature(atlasData, atlasData.objects.countries).features;

          g.selectAll("path.country")
            .data(countries)
            .enter().append("path")
            .attr("class", "country")
            .attr("d", path)
            .attr("class", d => {
              const info = nameMap[d.id];
              const code = info ? info.a3 : null;
              const st = code ? statusMap[code] : null;
              if (!st) return "fill-[#0f1320] stroke-[#1b233a] stroke-[0.35] hover:fill-[#182035] cursor-pointer transition-all";
              return `neon-${st.neonColor} cursor-pointer ${st.abroadOnly ? "border-red-glow" : "stroke-white/30 stroke-[0.35]"}`;
            })
            .on("click", (e, d) => onSelectModernCountry(nameMap[d.id] || { a3: "WLD", name: "Selected Territory" }));

          // Render Micro-state Pins (Tuvalu, Nauru, Monaco, Vatican, etc.)
          g.selectAll(".micro-pin")
            .data(MICRO_STATES)
            .enter().append("circle")
            .attr("cx", d => projection(d.coords)[0])
            .attr("cy", d => projection(d.coords)[1])
            .attr("r", 3.2)
            .attr("class", d => {
              const st = statusMap[d.a3];
              if (!st) return "fill-[#242e44] stroke-cyan-400/80 hover:fill-[#00f0ff] cursor-pointer";
              return `neon-${st.neonColor} ${st.abroadOnly ? "border-red-glow stroke-[1.5]" : "stroke-white/90 stroke-[1]"}`;
            })
            .on("click", (e, d) => onSelectModernCountry({ a3: d.a3, name: d.name }));

          // Render Non-Sovereign Territory Pins
          g.selectAll(".territory-pin")
            .data(TERRITORIES_LIST)
            .enter().append("circle")
            .attr("cx", d => projection(d.coords)[0])
            .attr("cy", d => projection(d.coords)[1])
            .attr("r", 3.5)
            .attr("fill", "url(#diagonalHatchRed)")
            .attr("stroke", "#ff1744")
            .attr("stroke-width", 1)
            .attr("class", "cursor-pointer")
            .on("click", (e, d) => onSelectModernCountry({ a3: d.code, name: d.name, isTerritory: true, mother: d.mother }));
        });
      }, [statusMap]);

      return (
        <div className="w-full h-full bg-[#05070d] flex items-center justify-center overflow-hidden">
          <svg ref={svgRef} viewBox="0 0 800 480" className="w-full h-full object-contain"></svg>
        </div>
      );
    }

    function LiveCoinCameraModal({ shape, onClose, onCapture }) {
      const videoRef = useRef(null);
      const [stream, setStream] = useState(null);

      const [zoom, setZoom] = useState(1);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const dragStartRef = useRef(null);

      useEffect(() => {
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 1280 } },
          audio: false
        })
          .then(mediaStream => {
            setStream(mediaStream);
            if (videoRef.current) {
              videoRef.current.srcObject = mediaStream;
              videoRef.current.play();
            }
          })
          .catch(err => {
            alert("Camera access denied or unavailable. Please enable permissions in your browser.");
            onClose();
          });

        return () => {
          if (stream) stream.getTracks().forEach(track => track.stop());
        };
      }, []);

      const handleTouchStart = (e) => {
        if (e.touches.length === 1) {
          dragStartRef.current = {
            startX: e.touches[0].clientX - pan.x,
            startY: e.touches[0].clientY - pan.y
          };
        }
      };

      const handleTouchMove = (e) => {
        if (dragStartRef.current && e.touches.length === 1) {
          setPan({
            x: e.touches[0].clientX - dragStartRef.current.startX,
            y: e.touches[0].clientY - dragStartRef.current.startY
          });
        }
      };

      const handleTouchEnd = () => {
        dragStartRef.current = null;
      };

      // Math-accurate crop scaled down to 300x300 JPEG (~18KB)
      const captureFrame = () => {
        if (!videoRef.current) return;
        const video = videoRef.current;
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        
        const videoAspect = vw / vh;
        let renderW, renderH, offsetX, offsetY;

        if (videoAspect > 1) {
          renderH = vh;
          renderW = vh;
          offsetX = (vw - vh) / 2;
          offsetY = 0;
        } else {
          renderW = vw;
          renderH = vw;
          offsetX = 0;
          offsetY = (vh - vw) / 2;
        }

        const cropSize = renderW / zoom;
        const sx = offsetX + (renderW - cropSize) / 2 - (pan.x / 120) * (cropSize / 2);
        const sy = offsetY + (renderH - cropSize) / 2 - (pan.y / 120) * (cropSize / 2);

        const clampedSx = Math.max(0, Math.min(vw - cropSize, sx));
        const clampedSy = Math.max(0, Math.min(vh - cropSize, sy));

        // High quality downscale canvas: 300x300
        const canvas = document.createElement("canvas");
        canvas.width = 300;
        canvas.height = 300;
        const ctx = canvas.getContext("2d");

        if (shape === 'round') {
          ctx.beginPath();
          ctx.arc(150, 150, 150, 0, Math.PI * 2);
          ctx.clip();
        }

        ctx.drawImage(video, clampedSx, clampedSy, cropSize, cropSize, 0, 0, 300, 300);

        if (stream) stream.getTracks().forEach(track => track.stop());
        onCapture(canvas.toDataURL("image/jpeg", 0.7));
      };

      return (
        <div className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-between p-3 select-none">
          
          <div className="w-full flex items-center justify-between text-white z-10 pt-2 px-1">
            <span className="text-xs font-bold uppercase tracking-wider text-[#00f0ff] flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full bg-[#00f0ff] animate-ping"></span>
              Zoom & Align Inside Guide
            </span>
            <button 
              onClick={() => {
                if (stream) stream.getTracks().forEach(track => track.stop());
                onClose();
              }} 
              className="text-white bg-slate-800 px-3 py-1 rounded-full text-xs font-bold">
              ✕ Cancel
            </button>
          </div>

          {/* Camera Viewport */}
          <div 
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
            className="relative w-72 h-72 sm:w-80 sm:h-80 flex items-center justify-center overflow-hidden rounded-3xl border border-slate-800 shadow-2xl bg-slate-950">
            
            <video 
              ref={videoRef} 
              playsInline 
              muted 
              style={{
                transform: `scale(${zoom}) translate(${pan.x / zoom}px, ${pan.y / zoom}px)`,
                transformOrigin: "center center"
              }}
              className="absolute inset-0 w-full h-full object-cover transition-transform duration-75" 
            />

            {/* Glowing HUD Silhouette Outline */}
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
              <div 
                className={`w-60 h-60 border-2 border-dashed border-[#00f0ff] shadow-[0_0_18px_rgba(0,240,255,0.8)] coin-mask-${shape}`}>
              </div>
            </div>

            <div className="absolute top-2 left-2 bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-lg text-[9px] text-slate-300 pointer-events-none">
              Drag to pan
            </div>
          </div>

          {/* Zoom Controls */}
          <div className="w-full max-w-xs flex flex-col items-center gap-2 z-10 bg-[#0d1220] p-3 rounded-2xl border border-slate-800">
            <div className="w-full flex items-center justify-between text-[11px] font-bold text-slate-300">
              <span className="text-[#00f0ff]">Digital Zoom</span>
              <span className="font-mono text-cyan-300">{zoom.toFixed(1)}x</span>
            </div>

            <input 
              type="range" 
              min="1" 
              max="3.5" 
              step="0.1" 
              value={zoom} 
              onChange={e => setZoom(parseFloat(e.target.value))}
              className="w-full accent-[#00f0ff] h-1.5 bg-slate-800 rounded-lg cursor-pointer" 
            />

            <div className="flex gap-2 w-full pt-1">
              {[1, 1.5, 2, 2.8].map(z => (
                <button
                  key={z}
                  type="button"
                  onClick={() => setZoom(z)}
                  className={`flex-1 py-1 rounded-lg text-[10px] font-bold border transition-colors ${zoom === z ? "bg-[#00f0ff] text-black border-[#00f0ff]" : "bg-slate-900 border-slate-700 text-slate-300"}`}>
                  {z}x
                </button>
              ))}
              <button
                type="button"
                onClick={() => { setZoom(1); setPan({ x: 0, y: 0 }); }}
                className="px-2 py-1 bg-slate-800 text-slate-400 rounded-lg text-[10px]">
                Reset
              </button>
            </div>
          </div>

          {/* Shutter Button */}
          <div className="w-full flex flex-col items-center gap-1.5 pb-3 z-10">
            <button 
              onClick={captureFrame}
              className="w-16 h-16 rounded-full bg-white border-4 border-[#00f0ff] shadow-[0_0_20px_#00f0ff] active:scale-90 transition-transform">
            </button>
            <span className="text-[10px] text-slate-400">Tap to Snap & Cut to Mask</span>
          </div>

        </div>
      );
    }

          c.denomination.toLowerCase().includes(query.toLowerCase()) ||
          (c.mint && c.mint.toLowerCase().includes(query.toLowerCase())) ||
          (c.ruler && c.ruler.toLowerCase().includes(query.toLowerCase()))

        return {
          countryCode: initialCountry?.a3 || "TUV",
          countryName: initialCountry?.name || "Tuvalu",
          isTerritory: !!initialCountry?.isTerritory,
          motherCountry: initialCountry?.mother || "",
          denomination: "",
          year: "",
          ruler: "",
          mint: "",
          grade: "UNC",
          shape: "round",
          inPossession: true,
          isUnion: false,
          neonColor: "cyan",
          notes: "",
          obverseImage: "",
          reverseImage: ""
        };
      });

      useEffect(() => {
        const handler = (e) => {
          if (e.detail) {
            setFormData(prev => ({ ...prev, [e.detail.field]: e.detail.image }));
          }
        };
        window.addEventListener("coin-photo-captured", handler);
        return () => window.removeEventListener("coin-photo-captured", handler);
      }, []);

      const handleImageUpload = (e, field) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          downscaleBase64(event.target.result, (compressed) => {
            setFormData(prev => ({ ...prev, [field]: compressed }));
          });
        };
        reader.readAsDataURL(file);
      };

        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">

            </div>

                    const foundTer = TERRITORIES_LIST.find(t => t.code === code);
                    if (foundSov) setFormData(p => ({ ...p, countryCode: foundSov.a3, countryName: foundSov.name, isTerritory: false }));
                    if (foundTer) setFormData(p => ({ ...p, countryCode: foundTer.code, countryName: foundTer.name, isTerritory: true, motherCountry: foundTer.mother }));

                  className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white">

              </div>

              <div className="grid grid-cols-2 gap-2.5">
                <div>
                  <label className="text-slate-400 block mb-1">Denomination *</label>
                  <input required value={formData.denomination} onChange={e => setFormData({...formData, denomination: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">Year</label>
                  <input value={formData.year} onChange={e => setFormData({...formData, year: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
              </div>

              <div>
                <label className="text-slate-400 block mb-1">Coin Silhouette Shape (Guides Camera)</label>
                <select 
                  value={formData.shape} 
                  onChange={e => setFormData({...formData, shape: e.target.value})}
                  className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white">
                  <option value="round">Round (Standard Circular)</option>
                  <option value="scalloped">Scalloped / Wavy (Eswatini, Tonga)</option>
                  <option value="heptagon">Heptagon (7-sided, UK 20p/50p)</option>
                  <option value="octagon">Octagon (8-sided, Chile, Lebanon)</option>
                  <option value="decagon">Decagon (10-sided, Philippines 2 Piso)</option>
                  <option value="dodecagon">Dodecagon (12-sided, Fiji 50c, UK £1)</option>
                  <option value="square">Square / Rounded Square (Aruba 50c)</option>
                </select>
              </div>

              <div className="grid grid-cols-2 gap-2.5">
                <div>
                  <label className="text-slate-400 block mb-1">Mintmark / City</label>
                  <input value={formData.mint} onChange={e => setFormData({...formData, mint: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">Ruler / Head of State</label>
                  <input value={formData.ruler} onChange={e => setFormData({...formData, ruler: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
              </div>

              <div className="p-2.5 bg-[#12182b] rounded-xl border border-slate-800 flex items-center justify-between">
                <div>
                  <div className="font-semibold text-white">In Physical Possession</div>
                  <div className="text-[10px] text-slate-400">If unchecked, shown with slim red border on map</div>
                </div>
                <input 
                  type="checkbox" 
                  checked={formData.inPossession} 
                  onChange={e => setFormData({...formData, inPossession: e.target.checked})} 
                  className="w-5 h-5 accent-[#00f0ff]" 
                />
              </div>

              {/* Photo Actions with Camera Viewfinder & File Upload */}
              <div className="grid grid-cols-2 gap-2.5">
                <div>
                  <label className="text-slate-400 block mb-1">Front Photo</label>
                  {formData.obverseImage ? (
                    <div className="relative flex justify-center p-2 bg-[#090d18] rounded-xl">
                      <img src={formData.obverseImage} className={`w-16 h-16 object-cover border border-[#00f0ff] coin-mask-${formData.shape}`} />
                      <button type="button" onClick={() => setFormData({...formData, obverseImage: ""})} className="absolute top-1 right-1 bg-black/80 text-white rounded-full w-4 h-4 text-[9px]">✕</button>
                    </div>
                  ) : (
                    <div className="flex gap-1.5">
                      <button 
                        type="button" 
                        onClick={() => onOpenLiveCamera('obverseImage', formData.shape)}
                        className="flex-1 py-2 bg-[#172138] hover:bg-[#1f2d4d] border border-[#00f0ff]/50 text-[#00f0ff] rounded-xl text-[10px] font-bold">
                        📸 Camera
                      </button>
                      <label className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-center text-slate-300 rounded-xl text-[10px] cursor-pointer">
                        📁 File
                        <input type="file" accept="image/*" onChange={e => handleImageUpload(e, 'obverseImage')} className="hidden" />
                      </label>
                    </div>
                  )}
                </div>

                <div>
                  <label className="text-slate-400 block mb-1">Back Photo</label>
                  {formData.reverseImage ? (
                    <div className="relative flex justify-center p-2 bg-[#090d18] rounded-xl">
                      <img src={formData.reverseImage} className={`w-16 h-16 object-cover border border-[#00f0ff] coin-mask-${formData.shape}`} />
                      <button type="button" onClick={() => setFormData({...formData, reverseImage: ""})} className="absolute top-1 right-1 bg-black/80 text-white rounded-full w-4 h-4 text-[9px]">✕</button>
                    </div>
                  ) : (
                    <div className="flex gap-1.5">
                      <button 
                        type="button" 
                        onClick={() => onOpenLiveCamera('reverseImage', formData.shape)}
                        className="flex-1 py-2 bg-[#172138] hover:bg-[#1f2d4d] border border-[#00f0ff]/50 text-[#00f0ff] rounded-xl text-[10px] font-bold">
                        📸 Camera
                      </button>
                      <label className="flex-1 py-2 bg-slate-800 hover:bg-slate-700 text-center text-slate-300 rounded-xl text-[10px] cursor-pointer">
                        📁 File
                        <input type="file" accept="image/*" onChange={e => handleImageUpload(e, 'reverseImage')} className="hidden" />
                      </label>
                    </div>
                  )}
                </div>
              </div>

              <button type="submit" className="w-full py-2.5 bg-[#00f0ff] hover:bg-[#00d0df] text-black font-extrabold rounded-xl text-xs uppercase tracking-wider shadow-lg">
                Save Coin to Vault
              </button>
            </form>
          </div>
        </div>
      );
    }

    function SyncModal({ coins, onExport, onImport, onClose }) {
      const [importVal, setImportVal] = useState("");

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-[#0e1424] border border-slate-700 rounded-2xl w-full max-w-md p-4 space-y-3.5">
            <div className="flex items-center justify-between pb-1 border-b border-slate-800">
              <h3 className="text-xs font-bold text-white flex items-center gap-1.5">
                <span>⇄</span> Collection Backup & Direct Import
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-sm">✕</button>
            </div>

            <div className="space-y-1.5">
              <button 
                onClick={onExport} 
                className="w-full py-2.5 bg-[#00f0ff] hover:bg-[#00d0df] text-black font-extrabold rounded-xl text-xs">
                Copy Collection JSON to Clipboard
              </button>
              <p className="text-[10px] text-slate-400 leading-relaxed">
                Export your full collection to text to send directly to friends or create a local backup.
              </p>
            </div>

            <div className="pt-2 border-t border-slate-800 space-y-2">
              <label className="text-[11px] text-slate-300 font-semibold block">Import JSON Data:</label>
              <textarea 
                rows="3" 
                placeholder="Paste collection JSON here..." 
                value={importVal} 
                onChange={e => setImportVal(e.target.value)} 
                className="w-full bg-[#141b2e] border border-slate-700 rounded-xl p-2 text-[10px] text-white focus:outline-none focus:border-[#00f0ff]" 
              />
              <button 
                onClick={() => onImport(importVal)} 
                className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs border border-slate-700">
                Load Imported Vault
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
