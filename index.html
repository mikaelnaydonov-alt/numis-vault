        setIsSyncing(true);
        fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Master-Key": API_KEY }
        })
          .then(res => res.json())
          .then(data => {
            if (data && data.record) {
              setVaultData({
                coins: data.record.coins || [],
                historicalEntities: data.record.historicalEntities || []
              });
            }
          })
          .catch(err => {
            console.warn("Using offline fallback cache:", err);
            const cached = localStorage.getItem("misha_master_vault_v6");
            if (cached) setVaultData(JSON.parse(cached));
          })
          .finally(() => setIsSyncing(false));
      }, []);

      const pushToCloud = (updated) => {
        setVaultData(updated);
        localStorage.setItem("misha_master_vault_v6", JSON.stringify(updated));
        setIsSyncing(true);
        fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": API_KEY
          },
          body: JSON.stringify(updated)
        })
          .catch(err => console.error("Cloud push failed:", err))
          .finally(() => setIsSyncing(false));
      };

        (vaultData.coins || []).forEach(c => {

        });
        return set.size;

          updatedList = list.map(c => c.id === editingCoin.id ? { ...coin, id: c.id } : c);

        setIsModalOpen(false);
        setEditingCoin(null);
      };

          pushToCloud({ ...vaultData, coins: updatedList });
        }

        }
      };

        const jsonStr = JSON.stringify(vaultData, null, 2);

        el.value = jsonStr;
        document.body.appendChild(el);
        el.select();
        document.execCommand("copy");
        document.body.removeChild(el);

        try {
          const parsed = JSON.parse(jsonStr);
          if (parsed && (parsed.coins || parsed.historicalEntities)) {

                </button>
                <button 
                  onClick={() => setView("vault")} 
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${view === "vault" ? "bg-[#00f0ff] text-black shadow-md" : "text-slate-400"}`}>
                  Vault ({(vaultData.coins || []).length})
                </button>
                <button 
                  onClick={() => setView("historical")} 
                  className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all ${view === "historical" ? "bg-amber-400 text-black shadow-md" : "text-amber-400/80"}`}>
                  Historical ({(vaultData.historicalEntities || []).length})
                </button>
              </div>
            </div>
          </header>

          {/* Dual-Scrubber Header for Sovereign & Territories */}
          {view !== "historical" && (
            <div className="bg-[#080b14] px-4 py-2 border-b border-slate-800">
              <div className="flex items-center justify-between text-xs mb-1 font-semibold">
                <span className="text-emerald-400 flex items-center gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-[#39ff14] shadow-[0_0_6px_#39ff14]"></span>
                  {sovereignCount} / 195 Sovereign States
                </span>
                <span className="text-emerald-400 font-mono">{sovereignPercent}%</span>
              </div>
              
              <div className="w-full bg-[#121624] h-2 rounded-full overflow-hidden border border-slate-800">
                <div 
                  className="bg-[#39ff14] h-full shadow-[0_0_10px_#39ff14] transition-all duration-500" 
                  style={{ width: `${sovereignPercent}%` }}>
                </div>
              </div>

              <div className="flex items-center justify-between pt-1.5">
                <button 
                  onClick={() => setShowTerritories(!showTerritories)}
                  className="text-[11px] text-slate-400 hover:text-white flex items-center gap-1">
                  <span>Territories & Dependencies ({territoriesCount} / {TERRITORIES_LIST.length})</span>
                  <span className={`text-[9px] transform transition-transform ${showTerritories ? "rotate-180" : ""}`}>▼</span>
                </button>
                <span className="text-[10px] text-slate-500 font-mono">Red Diagonal Striped</span>
              </div>

              {showTerritories && (
                <div className="mt-2 pt-2 border-t border-slate-800 flex gap-1.5 overflow-x-auto hide-scrollbar pb-1">
                  {TERRITORIES_LIST.map(t => {
                    const hasCoin = (vaultData.coins || []).some(c => c.countryCode === t.code);
                    return (
                      <button
                        key={t.code}
                        onClick={() => {
                          setSelectedCountry({ a3: t.code, name: t.name, isTerritory: true, mother: t.mother, coords: t.coords });
                          setEditingCoin(null);
                          setIsModalOpen(true);
                        }}
                        className={`px-2 py-1 rounded-lg text-[10px] whitespace-nowrap font-medium border ${hasCoin ? "bg-red-950/60 border-red-500 text-red-300" : "bg-[#101424] border-slate-800 text-slate-300"}`}>
                        {t.name} ({t.mother})
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* Main Display Area */}
          <main className="flex-1 overflow-hidden relative">
            {view === "map" && (
              <InteractiveWorldMap 
                coins={vaultData.coins || []}
                historicalEntities={vaultData.historicalEntities || []}
                onSelectModernCountry={(info) => {
                  setSelectedCountry(info);
                  setEditingCoin(null);
                  setIsModalOpen(true);
                }}
              />
            )}

            {view === "vault" && (
              <CollectionVault 
                coins={vaultData.coins || []} 
                onDeleteCoin={handleDeleteCoin}
                onEditCoin={(c) => {
                  setEditingCoin(c);
                  setSelectedCountry({ a3: c.countryCode, name: c.countryName });
                  setIsModalOpen(true);
                }}
                onOpenImage={(src) => setLightboxImg(src)}
                onAddClick={() => {
                  setEditingCoin(null);
                  setSelectedCountry(null);
                  setIsModalOpen(true);
                }}
              />
            )}

            {view === "historical" && (
              <HistoricalStudio 
                entities={vaultData.historicalEntities || []}
                onSaveEntity={handleSaveHistoricalEntity}
                onDeleteEntity={handleDeleteHistoricalEntity}
              />
            )}
          </main>

          {/* Add / Edit Coin Drawer */}
          {isModalOpen && (
            <AddEditCoinModal 
              initialCountry={selectedCountry}
              editingCoin={editingCoin}
              onClose={() => { setIsModalOpen(false); setEditingCoin(null); }}
              onSave={handleSaveCoin}
              onOpenLiveCamera={(field, shape) => {
                setCameraTargetField(field);
                setActiveCameraShape(shape);
              }}
            />
          )}

          {/* Live In-App Camera Viewfinder with Sensor Crop & HUD */}
          {cameraTargetField && (
            <LiveCoinCameraModal 
              shape={activeCameraShape}
              onClose={() => setCameraTargetField(null)}
              onCapture={(base64Img) => {
                window.dispatchEvent(new CustomEvent("coin-photo-captured", {
                  detail: { field: cameraTargetField, image: base64Img }
                }));
                setCameraTargetField(null);
              }}
            />
          )}

          {/* 1-Click Sync & Manual JSON Backup Modal */}
          {isSyncModalOpen && (
            <SyncModal 
              data={vaultData}
              onExport={handleExport}
              onImport={handleImport}
              onClose={() => setIsSyncModalOpen(false)}
            />
          )}

          {/* Image Lightbox */}
          {lightboxImg && (
            <div onClick={() => setLightboxImg(null)} className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
              <img src={lightboxImg} className="max-w-full max-h-[85vh] rounded-2xl object-contain shadow-2xl" />
              <button className="absolute top-5 right-5 text-white bg-slate-800 px-3 py-1 rounded-full text-xs font-bold">✕ Close</button>
            </div>
          )}
        </div>
      );
    }

    function InteractiveWorldMap({ coins, historicalEntities, onSelectModernCountry }) {
      const svgRef = useRef(null);

      const statusMap = useMemo(() => {
        const map = {};
        coins.forEach(c => {
          let targets = [c.countryCode];
          if (WEST_AFRICAN_CFA.includes(c.countryCode) && c.isUnion) targets = WEST_AFRICAN_CFA;
          if (EASTERN_CARIBBEAN.includes(c.countryCode) && c.isUnion) targets = EASTERN_CARIBBEAN;

          targets.forEach(code => {
            if (!map[code]) map[code] = { collected: true, neonColor: c.neonColor || 'cyan', abroadOnly: !c.inPossession };
            else if (c.inPossession) map[code].abroadOnly = false;
          });
        });
        return map;
      }, [coins]);

      useEffect(() => {
        const width = 800;
        const height = 480;
        const svg = d3.select(svgRef.current);
        svg.selectAll("*").remove();

        const defs = svg.append("defs");
        const hatch = defs.append("pattern")
          .attr("id", "diagonalHatchRed")
          .attr("width", 8).attr("height", 8)
          .attr("patternTransform", "rotate(45 0 0)").attr("patternUnits", "userSpaceOnUse");
        hatch.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 8)
          .attr("stroke", "#ff1744").attr("stroke-width", 2.5);

        const g = svg.append("g");
        const projection = d3.geoNaturalEarth1().scale(150).translate([width / 2, height / 1.9]);
        const path = d3.geoPath().projection(projection);

        const zoom = d3.zoom().scaleExtent([1, 14]).on("zoom", (e) => g.attr("transform", e.transform));
        svg.call(zoom);

        Promise.all([
          d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
          d3.tsv("https://unpkg.com/world-atlas@1.1.4/world/110m.tsv")
        ]).then(([atlasData, tsvData]) => {
          const nameMap = {};
          tsvData.forEach(d => { nameMap[d.iso_n3] = { a3: d.iso_a3, name: d.name }; });
          nameMap["728"] = { a3: "SSD", name: "South Sudan" };

          const countries = topojson.feature(atlasData, atlasData.objects.countries).features;

          g.selectAll("path.country")
            .data(countries)
            .enter().append("path")
            .attr("class", "country")
            .attr("d", path)
            .attr("class", d => {
              const info = nameMap[d.id];
              const code = info ? info.a3 : null;
              const st = code ? statusMap[code] : null;
              if (!st) return "fill-[#0f1320] stroke-[#1b233a] stroke-[0.35] hover:fill-[#182035] cursor-pointer transition-all";
              return `neon-${st.neonColor} cursor-pointer ${st.abroadOnly ? "border-red-glow" : "stroke-white/30 stroke-[0.35]"}`;
            })
            .on("click", (e, d) => onSelectModernCountry(nameMap[d.id] || { a3: "WLD", name: "Selected Territory" }));

          // Render any saved historical entity mint pins onto modern map as well
          historicalEntities.forEach(he => {
            if (he.mintPin && he.mintPin.coords) {
              const pt = projection(he.mintPin.coords);
              if (pt) {
                const pinGroup = g.append("g")
                  .attr("transform", `translate(${pt[0]}, ${pt[1]})`)
                  .attr("class", "cursor-pointer");
                pinGroup.append("circle").attr("r", 4).attr("fill", "#ff1744").attr("filter", "drop-shadow(0 0 4px #ff1744)");
                pinGroup.append("title").text(`${he.mintPin.city || "Historical Mint"} (${he.name})`);
              }
            }
          });

          // Micro-states pins
          g.selectAll(".micro-pin")
            .data(MICRO_STATES)
            .enter().append("circle")
            .attr("cx", d => projection(d.coords)[0])
            .attr("cy", d => projection(d.coords)[1])
            .attr("r", 2.6)
            .attr("class", d => {
              const st = statusMap[d.a3];
              if (!st) return "fill-[#242e44] stroke-cyan-400/60 hover:fill-[#00f0ff] cursor-pointer";
              return `neon-${st.neonColor} ${st.abroadOnly ? "border-red-glow stroke-[1.2]" : "stroke-white/70"}`;
            })
            .on("click", (e, d) => onSelectModernCountry({ a3: d.a3, name: d.name }));

          // Striped non-sovereign territory pins
          g.selectAll(".territory-pin")
            .data(TERRITORIES_LIST)
            .enter().append("circle")
            .attr("cx", d => projection(d.coords)[0])
            .attr("cy", d => projection(d.coords)[1])
            .attr("r", 3)
            .attr("fill", "url(#diagonalHatchRed)")
            .attr("stroke", "#ff1744")
            .attr("stroke-width", 0.8)
            .attr("class", "cursor-pointer")
            .on("click", (e, d) => onSelectModernCountry({ a3: d.code, name: d.name, isTerritory: true, mother: d.mother }));
        });
      }, [statusMap, historicalEntities]);

      return (
        <div className="w-full h-full bg-[#05070d] flex items-center justify-center overflow-hidden">
          <svg ref={svgRef} viewBox="0 0 800 480" className="w-full h-full object-contain"></svg>
        </div>
      );
    }

    function HistoricalStudio({ entities, onSaveEntity, onDeleteEntity }) {
      const svgRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [currentPoints, setCurrentPoints] = useState([]);
      const [closedPolygons, setClosedPolygons] = useState([]);
      
      const [selectedPolygonIndex, setSelectedPolygonIndex] = useState(null);
      const [customizerOpen, setCustomizerOpen] = useState(false);
      const [showSavedDrawer, setShowSavedDrawer] = useState(false);

      // Crimson Mint Pin state
      const [pinPosition, setPinPosition] = useState(null);
      const [pinConfirmed, setPinConfirmed] = useState(false);
      const [pinCityName, setPinCityName] = useState("");
      const [pinCountryOverlap, setPinCountryOverlap] = useState("");

      const [entityMeta, setEntityMeta] = useState({
        name: "",
        ruler: "",
        startYear: "",
        endYear: ""
      });

      const projectionRef = useRef(d3.geoNaturalEarth1().scale(150).translate([400, 250]));
      const worldGeoRef = useRef(null);

      useEffect(() => {
        const svg = d3.select(svgRef.current);
        svg.selectAll("*").remove();

        const defs = svg.append("defs");

        // Generate patterns dynamically for striped polygons
        closedPolygons.forEach((poly, idx) => {
          if (poly.striped) {
            const pat = defs.append("pattern")
              .attr("id", `stripe-pat-${idx}`)
              .attr("width", 8).attr("height", 8)
              .attr("patternTransform", "rotate(45 0 0)")
              .attr("patternUnits", "userSpaceOnUse");
            
            pat.append("rect").attr("width", 8).attr("height", 8).attr("fill", poly.bgColor || "#111625");
            pat.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 8)
              .attr("stroke", poly.stripeColor || "#ff1744").attr("stroke-width", 2.5);
          }
        });

        const g = svg.append("g").attr("id", "studio-canvas");
        const path = d3.geoPath().projection(projectionRef.current);

        const zoom = d3.zoom().scaleExtent([1, 14]).on("zoom", (e) => g.attr("transform", e.transform));
        svg.call(zoom);

        // Load Ghosted Modern Layer
        Promise.all([
          d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
          d3.tsv("https://unpkg.com/world-atlas@1.1.4/world/110m.tsv")
        ]).then(([atlasData, tsvData]) => {
          worldGeoRef.current = {
            features: topojson.feature(atlasData, atlasData.objects.countries).features,
            tsv: tsvData
          };

          g.selectAll(".ghost-country")
            .data(worldGeoRef.current.features)
            .enter().append("path")
            .attr("d", path)
            .attr("fill", "#090d18")
            .attr("stroke", "#192238")
            .attr("stroke-width", 0.4)
            .attr("opacity", 0.85);
        });

        // Click on map canvas to add polygon vertices
        svg.on("click", (event) => {
          if (!isDrawing) return;
          const [mx, my] = d3.pointer(event, g.node());
          const coords = projectionRef.current.invert([mx, my]);
          if (coords) setCurrentPoints(prev => [...prev, coords]);
        });

      }, [isDrawing, closedPolygons]);

      // Point-in-polygon ray casting to detect modern country for the mint
      const detectCountry = (coords) => {
        if (!worldGeoRef.current || !coords) return "Unknown Territory";
        const found = worldGeoRef.current.features.find(feature => d3.geoContains(feature, coords));
        if (found) {
          const item = worldGeoRef.current.tsv.find(t => t.iso_n3 === found.id);
          return item ? item.name : "Sovereign Territory";
        }
        return "International Waters / Unknown";
      };

      const handleConfirmPin = () => {
        if (!pinPosition) return;
        setPinConfirmed(true);
        const detected = detectCountry(pinPosition);
        setPinCountryOverlap(detected);
      };

      const handleCompletePolygon = () => {
        if (currentPoints.length < 3) {
          alert("Draw at least 3 points to complete a closed shape.");
          return;
        }
        const newPoly = {
          points: currentPoints,
          bgColor: "#ffd600",
          striped: false,
          stripeColor: "#ff1744"
        };
        setClosedPolygons(prev => [...prev, newPoly]);
        setCurrentPoints([]);
        setIsDrawing(false);
      };

      const handleSaveFullEntity = () => {
        if (!entityMeta.name) {
          alert("Please label the historical entity name.");
          return;
        }
        if (closedPolygons.length === 0) {
          alert("Please draw at least one closed polygon territory for this entity.");
          return;
        }
        const entity = {
          id: Date.now().toString(),
          ...entityMeta,
          polygons: closedPolygons,
          mintPin: pinConfirmed ? {
            coords: pinPosition,
            city: pinCityName,
            modernCountry: pinCountryOverlap
          } : null
        };
        onSaveEntity(entity);
        alert(`Saved ${entityMeta.name} to Cloud Historical Vault!`);
      };

      const loadExistingEntity = (ent) => {
        setEntityMeta({
          name: ent.name || "",
          ruler: ent.ruler || "",
          startYear: ent.startYear || "",
          endYear: ent.endYear || ""
        });
        setClosedPolygons(ent.polygons || []);
        if (ent.mintPin) {
          setPinPosition(ent.mintPin.coords);
          setPinCityName(ent.mintPin.city || "");
          setPinCountryOverlap(ent.mintPin.modernCountry || "");
          setPinConfirmed(true);
        } else {
          setPinPosition(null);
          setPinConfirmed(false);
        }
        setShowSavedDrawer(false);
      };

      return (
        <div className="relative w-full h-full bg-[#05070d] overflow-hidden flex flex-col">
          
          {/* Top Bar Studio Controls */}
          <div className="absolute top-2 inset-x-2 z-20 flex flex-wrap gap-2 items-center justify-between bg-[#0b101ef0] p-2 rounded-xl border border-slate-800 backdrop-blur-md">
            <input 
              type="text" 
              placeholder="Historical Entity (e.g. Polish-Lithuanian Commonwealth)" 
              value={entityMeta.name} 
              onChange={e => setEntityMeta({...entityMeta, name: e.target.value})}
              className="bg-[#131a2e] border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white flex-1 min-w-[150px] focus:border-amber-400 focus:outline-none" 
            />
            <div className="flex gap-1.5 text-xs">
              <input 
                type="text" 
                placeholder="Ruler" 
                value={entityMeta.ruler} 
                onChange={e => setEntityMeta({...entityMeta, ruler: e.target.value})}
                className="w-20 bg-[#131a2e] border border-slate-700 rounded-lg px-2 py-1 text-white" 
              />
              <input 
                type="text" 
                placeholder="Years (1569-1795)" 
                value={entityMeta.startYear} 
                onChange={e => setEntityMeta({...entityMeta, startYear: e.target.value})}
                className="w-24 bg-[#131a2e] border border-slate-700 rounded-lg px-2 py-1 text-white" 
              />
              <button 
                onClick={handleSaveFullEntity}
                className="bg-amber-400 hover:bg-amber-300 font-extrabold text-black px-3 py-1 rounded-lg shadow-md">
                Save
              </button>
              <button 
                onClick={() => setShowSavedDrawer(!showSavedDrawer)}
                className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-2 py-1 rounded-lg text-xs">
                Saved ({entities.length})
              </button>
            </div>
          </div>

          <svg ref={svgRef} viewBox="0 0 800 480" className="w-full h-full object-contain">
            {/* Render Closed Polygons */}
            {closedPolygons.map((poly, idx) => {
              const pts = poly.points.map(p => projectionRef.current(p));
              const d = d3.line().curve(d3.curveLinearClosed)(pts);
              return (
                <path
                  key={idx}
                  d={d}
                  fill={poly.striped ? `url(#stripe-pat-${idx})` : poly.bgColor}
                  fillOpacity={0.65}
                  stroke={poly.bgColor || "#ffd600"}
                  strokeWidth={1.5}
                  className="cursor-pointer hover:opacity-90"
                  onClick={() => {
                    setSelectedPolygonIndex(idx);
                    setCustomizerOpen(true);
                  }}
                />
              );
            })}

            {/* Render In-Progress Polyline */}
            {currentPoints.length > 0 && (
              <g>
                <path 
                  d={d3.line()(currentPoints.map(p => projectionRef.current(p)))} 
                  fill="none" 
                  stroke="#39ff14" 
                  strokeWidth={1.5} 
                  strokeDasharray="4,3" 
                />
                {currentPoints.map((p, idx) => {
                  const [cx, cy] = projectionRef.current(p);
                  return <circle key={idx} cx={cx} cy={cy} r={3} fill="#39ff14" />;
                })}
              </g>
            )}

            {/* Crimson Mint Pin */}
            {pinPosition && (
              <g transform={`translate(${projectionRef.current(pinPosition)[0]}, ${projectionRef.current(pinPosition)[1]})`}>
                <circle r={5} fill="#ff1744" filter="drop-shadow(0 0 5px #ff1744)" />
                <circle r={2} fill="#ffffff" />
              </g>
            )}
          </svg>

          {/* Bottom Left Tool: Draggable Crimson Mint Pin Placer */}
          <div className="absolute bottom-3 left-3 z-30 flex flex-col gap-2">
            {!pinConfirmed ? (
              <div className="flex items-center gap-1.5 bg-[#0b1122f0] p-2 rounded-xl border border-slate-800 backdrop-blur-md">
                <button 
                  onClick={() => setPinPosition([18.0, 54.0])} 
                  className="bg-red-600 hover:bg-red-500 text-white font-bold p-2 rounded-lg text-sm shadow-md"
                  title="Drop Crimson Mint Pin">
                  📍
                </button>
                {pinPosition && (
                  <>
                    <input 
                      type="text" 
                      placeholder="Mint (e.g. Riga)" 
                      value={pinCityName} 
                      onChange={e => setPinCityName(e.target.value)}
                      className="bg-[#141b2e] border border-slate-700 rounded-lg px-2 py-1 text-xs text-white w-28" 
                    />
                    <button 
                      onClick={handleConfirmPin}
                      className="bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold px-2.5 py-1 rounded-lg text-sm shadow-md">
                      ✅
                    </button>
                  </>
                )}
              </div>
            ) : (
              <div className="bg-[#0b1122f2] p-2 rounded-xl border border-emerald-500/50 text-[11px] backdrop-blur-md text-emerald-300 font-semibold space-y-0.5">
                <div>📍 {pinCityName || "Mint Location"}</div>
                <div className="text-[10px] text-slate-400">Modern Country: <span className="text-white">{pinCountryOverlap}</span></div>
                <button onClick={() => setPinConfirmed(false)} className="text-[9px] text-slate-500 underline">Change Pin Location</button>
              </div>
            )}
          </div>

          {/* Bottom Right Tool: Pencil Draw Mode */}
          <div className="absolute bottom-3 right-3 z-30 flex items-center gap-2">
            {isDrawing && (
              <button 
                onClick={handleCompletePolygon}
                className="bg-emerald-500 hover:bg-emerald-400 text-black font-black px-3 py-2 rounded-xl text-xs shadow-lg">
                Complete Closed Polygon
              </button>
            )}
            <button 
              onClick={() => setIsDrawing(!isDrawing)}
              className={`p-3 rounded-2xl text-base shadow-xl transition-all ${isDrawing ? "bg-[#39ff14] text-black ring-4 ring-[#39ff14]/30" : "bg-amber-400 text-black"}`}
              title="Draw Historical Boundary">
              ✏️
            </button>
          </div>

          {/* Saved Historical Entities Drawer */}
          {showSavedDrawer && (
            <div className="absolute top-16 right-2 z-40 bg-[#0d1324] border border-slate-700 rounded-2xl p-3 w-64 shadow-2xl max-h-64 overflow-y-auto hide-scrollbar space-y-2">
              <div className="flex items-center justify-between border-b border-slate-800 pb-1">
                <span className="text-xs font-bold text-amber-400">Historical Archive</span>
                <button onClick={() => setShowSavedDrawer(false)} className="text-slate-400 text-xs">✕</button>
              </div>
              {entities.length === 0 ? (
                <div className="text-[11px] text-slate-500 py-2">No historical entities saved yet.</div>
              ) : (
                entities.map(ent => (
                  <div key={ent.id} className="p-2 bg-[#12192e] rounded-xl flex items-center justify-between text-xs">
                    <div className="cursor-pointer truncate mr-2" onClick={() => loadExistingEntity(ent)}>
                      <div className="font-bold text-white truncate">{ent.name}</div>
                      <div className="text-[10px] text-slate-400">{ent.startYear} - {ent.endYear}</div>
                    </div>
                    <button onClick={() => onDeleteEntity(ent.id)} className="text-slate-500 hover:text-red-400 text-xs p-1">🗑</button>
                  </div>
                ))
              )}
            </div>
          )}

          {/* Polygon Customizer Drawer */}
          {customizerOpen && selectedPolygonIndex !== null && (
            <div className="fixed inset-x-0 bottom-0 z-50 bg-[#0d1324] border-t border-slate-700 rounded-t-3xl p-4 max-h-[60vh] overflow-y-auto hide-scrollbar space-y-3 shadow-2xl">
              <div className="flex items-center justify-between pb-1 border-b border-slate-800">
                <h3 className="text-xs font-bold text-white">Closed Polygon #{selectedPolygonIndex + 1} Style</h3>
                <button onClick={() => setCustomizerOpen(false)} className="text-slate-400 hover:text-white font-bold text-sm">✕</button>
              </div>

    function LiveCoinCameraModal({ shape, onClose, onCapture }) {
      const videoRef = useRef(null);
      const [stream, setStream] = useState(null);

      const [zoom, setZoom] = useState(1);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const dragStartRef = useRef(null);

      useEffect(() => {
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 1280 } },
          audio: false
        })
          .then(mediaStream => {
            setStream(mediaStream);
            if (videoRef.current) {
              videoRef.current.srcObject = mediaStream;
              videoRef.current.play();
            }
          })
          .catch(err => {
            alert("Could not access camera. Please enable camera permissions in browser settings.");
            onClose();
          });

        return () => {
          if (stream) {
            stream.getTracks().forEach(track => track.stop());
          }
        };
      }, []);

      const handleTouchStart = (e) => {
        if (e.touches.length === 1) {
          dragStartRef.current = {
            startX: e.touches[0].clientX - pan.x,
            startY: e.touches[0].clientY - pan.y
          };
        }
      };

      const handleTouchMove = (e) => {
        if (dragStartRef.current && e.touches.length === 1) {
          setPan({
            x: e.touches[0].clientX - dragStartRef.current.startX,
            y: e.touches[0].clientY - dragStartRef.current.startY
          });
        }
      };

      const handleTouchEnd = () => {
        dragStartRef.current = null;
      };

      // Math-accurate crop matching on-screen CSS scale & object-cover
      const captureFrame = () => {
        if (!videoRef.current) return;
        const video = videoRef.current;
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        
        const videoAspect = vw / vh;
        let renderW, renderH, offsetX, offsetY;

        if (videoAspect > 1) {
          renderH = vh;
          renderW = vh;
          offsetX = (vw - vh) / 2;
          offsetY = 0;
        } else {
          renderW = vw;
          renderH = vw;
          offsetX = 0;
          offsetY = (vh - vw) / 2;
        }

        const cropSize = renderW / zoom;
        const sx = offsetX + (renderW - cropSize) / 2 - (pan.x / 120) * (cropSize / 2);
        const sy = offsetY + (renderH - cropSize) / 2 - (pan.y / 120) * (cropSize / 2);

        const clampedSx = Math.max(0, Math.min(vw - cropSize, sx));
        const clampedSy = Math.max(0, Math.min(vh - cropSize, sy));

        const canvas = document.createElement("canvas");
        canvas.width = 600;
        canvas.height = 600;
        const ctx = canvas.getContext("2d");

        // Hard silhouette clip directly onto the canvas
        if (shape === 'round') {
          ctx.beginPath();
          ctx.arc(300, 300, 300, 0, Math.PI * 2);
          ctx.clip();
        }

        ctx.drawImage(video, clampedSx, clampedSy, cropSize, cropSize, 0, 0, 600, 600);

        if (stream) stream.getTracks().forEach(track => track.stop());
        onCapture(canvas.toDataURL("image/jpeg", 0.85));
      };

      return (
        <div className="fixed inset-0 z-50 bg-black flex flex-col items-center justify-between p-3 select-none">
          
          {/* Header */}
          <div className="w-full flex items-center justify-between text-white z-10 pt-2 px-1">
            <span className="text-xs font-bold uppercase tracking-wider text-[#00f0ff] flex items-center gap-1.5">
              <span className="w-2 h-2 rounded-full bg-[#00f0ff] animate-ping"></span>
              Zoom & Align Coin
            </span>
            <button 
              onClick={() => {
                if (stream) stream.getTracks().forEach(track => track.stop());
                onClose();
              }} 
              className="text-white bg-slate-800 px-3 py-1 rounded-full text-xs font-bold">
              ✕ Cancel
            </button>
          </div>

          {/* Interactive Viewport */}
          <div 
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
            className="relative w-72 h-72 sm:w-80 sm:h-80 flex items-center justify-center overflow-hidden rounded-3xl border border-slate-800 shadow-2xl bg-slate-950">
            
            <video 
              ref={videoRef} 
              playsInline 
              muted 
              style={{
                transform: `scale(${zoom}) translate(${pan.x / zoom}px, ${pan.y / zoom}px)`,
                transformOrigin: "center center"
              }}
              className="absolute inset-0 w-full h-full object-cover transition-transform duration-75" 
            />

            {/* Glowing Dashed HUD Matching Selected Shape */}
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
              <div 
                className={`w-60 h-60 border-2 border-dashed border-[#00f0ff] shadow-[0_0_18px_rgba(0,240,255,0.7)] coin-mask-${shape}`}>
              </div>
            </div>

            <div className="absolute top-2 left-2 bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-lg text-[9px] text-slate-300 pointer-events-none">
              Drag to pan
            </div>
          </div>

          {/* Zoom Slider & Presets */}
          <div className="w-full max-w-xs flex flex-col items-center gap-2 z-10 bg-[#0d1220] p-3 rounded-2xl border border-slate-800">
            <div className="w-full flex items-center justify-between text-[11px] font-bold text-slate-300">
              <span className="text-[#00f0ff]">Zoom</span>
              <span className="font-mono text-cyan-300">{zoom.toFixed(1)}x</span>
            </div>

            <input 
              type="range" 
              min="1" 
              max="3.5" 
              step="0.1" 
              value={zoom} 
              onChange={e => setZoom(parseFloat(e.target.value))}
              className="w-full accent-[#00f0ff] h-1.5 bg-slate-800 rounded-lg cursor-pointer" 
            />

            <div className="flex gap-2 w-full pt-1">
              {[1, 1.5, 2, 2.8].map(z => (
                <button
                  key={z}
                  type="button"
                  onClick={() => setZoom(z)}
                  className={`flex-1 py-1 rounded-lg text-[10px] font-bold border transition-colors ${zoom === z ? "bg-[#00f0ff] text-black border-[#00f0ff]" : "bg-slate-900 border-slate-700 text-slate-300"}`}>
                  {z}x
                </button>
              ))}
              <button
                type="button"
                onClick={() => { setZoom(1); setPan({ x: 0, y: 0 }); }}
                className="px-2 py-1 bg-slate-800 text-slate-400 rounded-lg text-[10px]">
                Reset
              </button>
            </div>
          </div>

          {/* Shutter Button */}
          <div className="w-full flex flex-col items-center gap-1.5 pb-3 z-10">
            <button 
              onClick={captureFrame}
              className="w-16 h-16 rounded-full bg-white border-4 border-[#00f0ff] shadow-[0_0_20px_#00f0ff] active:scale-90 transition-transform">
            </button>
            <span className="text-[10px] text-slate-400">Tap to Snap & Cut to Mask</span>
          </div>

        </div>
      );
    }

            setFormData(prev => ({ ...prev, [e.detail.field]: e.detail.image }));
          }
        };
        window.addEventListener("coin-photo-captured", handler);
        return () => window.removeEventListener("coin-photo-captured", handler);
      }, []);

      const handleImageUpload = (e, field) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxDim = 600;
            let width = img.width;
            let height = img.height;
            if (width > height && width > maxDim) {
              height *= maxDim / width;
              width = maxDim;
            } else if (height > maxDim) {
              width *= maxDim / height;
              height = maxDim;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            setFormData(prev => ({ ...prev, [field]: canvas.toDataURL("image/jpeg", 0.75) }));
          };
        };
        reader.readAsDataURL(file);
      };

              <label className="text-[11px] text-slate-300 font-semibold block">Direct Device Import:</label>
              <textarea 
                rows="3" 
                placeholder="Paste JSON string here..." 
                value={importVal} 
                onChange={e => setImportVal(e.target.value)} 
                className="w-full bg-[#141b2e] border border-slate-700 rounded-xl p-2 text-[10px] text-white focus:outline-none focus:border-[#00f0ff]" 
              />
              <button 
                onClick={() => onImport(importVal)} 
                className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs border border-slate-700">
                Load Imported Vault
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
