    // --- Interactive World Map Engine ---
    function InteractiveWorldMap({ coins, timelineYear, polygonColors, onSelectPolygon, onSelectModernCountry, onInspectEmpire }) {
      const svgRef = useRef(null);

      const statusMap = useMemo(() => {
        const map = {};
        coins.forEach(c => {
          let targets = [c.countryCode];
          if (WEST_AFRICAN_CFA.includes(c.countryCode) && c.isUnion) targets = WEST_AFRICAN_CFA;
          if (EASTERN_CARIBBEAN.includes(c.countryCode) && c.isUnion) targets = EASTERN_CARIBBEAN;

          targets.forEach(code => {
            if (!map[code]) {
              map[code] = { collected: true, neonColor: c.neonColor, abroadOnly: !c.inPossession };
            } else if (c.inPossession) {
              map[code].abroadOnly = false;
            }
          });
        });
        return map;
      }, [coins]);

      useEffect(() => {
        const width = 800;
        const height = 480;
        const svg = d3.select(svgRef.current);
        svg.selectAll("*").remove();

        const defs = svg.append("defs");
        
        // Red diagonal stripe pattern
        const hatch = defs.append("pattern")
          .attr("id", "diagonalHatchRed")
          .attr("width", 8)
          .attr("height", 8)
          .attr("patternTransform", "rotate(45 0 0)")
          .attr("patternUnits", "userSpaceOnUse");

        hatch.append("line")
          .attr("x1", 0).attr("y1", 0).attr("x2", 0).attr("y2", 8)
          .attr("stroke", "#ff1744").attr("stroke-width", 2.5);

        const g = svg.append("g");
        const projection = d3.geoNaturalEarth1().scale(150).translate([width / 2, height / 1.9]);
        const path = d3.geoPath().projection(projection);

        const zoom = d3.zoom().scaleExtent([1, 14]).on("zoom", (e) => g.attr("transform", e.transform));
        svg.call(zoom);

        Promise.all([
          d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
          d3.tsv("https://unpkg.com/world-atlas@1.1.4/world/110m.tsv")
        ]).then(([atlasData, tsvData]) => {
          const nameMap = {};
          tsvData.forEach(d => { nameMap[d.iso_n3] = { a3: d.iso_a3, name: d.name }; });
          nameMap["728"] = { a3: "SSD", name: "South Sudan" };

          const countries = topojson.feature(atlasData, atlasData.objects.countries).features;

          // Modern Polygons
          g.selectAll(".country-poly")
            .data(countries)
            .enter()
            .append("path")
            .attr("d", path)
            .attr("class", d => {
              const info = nameMap[d.id];
              const code = info ? info.a3 : null;
              const st = code ? statusMap[code] : null;

              if (!st) return "fill-[#101422] stroke-[#1f273b] stroke-[0.35] hover:fill-[#1b233a] cursor-pointer transition-all";
              let cls = `neon-${st.neonColor} cursor-pointer `;
              cls += st.abroadOnly ? "border-red-glow" : "stroke-white/30 stroke-[0.35]";
              return cls;
            })
            .on("click", (event, d) => {
              const info = nameMap[d.id] || { a3: "WLD", name: "Selected Territory" };
              onSelectModernCountry(info);
            });

          // Historical Empires Active in Timeline
          const activeEmpires = HISTORICAL_EMPIRES.filter(e => timelineYear >= e.startYear && timelineYear <= e.endYear);

          activeEmpires.forEach(emp => {
            emp.polygons.forEach(poly => {
              const polyCoords = poly.coords.map(c => projection(c));
              const lineGen = d3.line().curve(d3.curveLinearClosed);
              const pathData = lineGen(polyCoords);

              const fillColor = polygonColors[poly.id] || poly.defaultColor;

              g.append("path")
                .attr("d", pathData)
                .attr("fill", fillColor)
                .attr("fill-opacity", 0.4)
                .attr("stroke", fillColor)
                .attr("stroke-width", 1.2)
                .attr("stroke-dasharray", "3,2")
                .attr("class", "cursor-pointer")
                .on("click", (event) => {
                  event.stopPropagation();
                  onSelectPolygon(poly);
                  onInspectEmpire(emp);
                });

              if (poly.hatched) {
                g.append("path")
                  .attr("d", pathData)
                  .attr("fill", "url(#diagonalHatchRed)")
                  .attr("fill-opacity", 0.7)
                  .attr("pointer-events", "none");
              }
            });
          });

          // Micro-states Pins
          g.selectAll(".micro-pin")
            .data(MICRO_STATES)
            .enter()
            .append("circle")
            .attr("cx", d => projection(d.coords)[0])
            .attr("cy", d => projection(d.coords)[1])
            .attr("r", 2.6)
            .attr("class", d => {
              const st = statusMap[d.a3];
              if (!st) return "fill-[#242e44] stroke-cyan-400/60 hover:fill-[#00f0ff] cursor-pointer";
              return `neon-${st.neonColor} ${st.abroadOnly ? "border-red-glow stroke-[1.2]" : "stroke-white/70"}`;
            })
            .on("click", (e, d) => onSelectModernCountry({ a3: d.a3, name: d.name }));

          // Territory Pins (Striped)
          g.selectAll(".territory-pin")
            .data(TERRITORIES_LIST)
            .enter()
            .append("circle")
            .attr("cx", d => projection(d.coords)[0])
            .attr("cy", d => projection(d.coords)[1])
            .attr("r", 3)
            .attr("fill", "url(#diagonalHatchRed)")
            .attr("stroke", "#ff1744")
            .attr("stroke-width", 0.8)
            .attr("class", "cursor-pointer")
            .on("click", (e, d) => onSelectModernCountry({ a3: d.code, name: d.name, isTerritory: true, mother: d.mother }));

          // Draggable Mint Pins from Saved Coins
          coins.filter(c => c.mintCoords && c.mintCoords.length === 2).forEach(c => {
            const pos = projection(c.mintCoords);
            if (pos) {
              const pinGroup = g.append("g")
                .attr("transform", `translate(${pos[0]}, ${pos[1]})`)
                .attr("class", "cursor-pointer");

              pinGroup.append("circle")
                .attr("r", 4)
                .attr("fill", "#ff1744")
                .attr("filter", "drop-shadow(0 0 4px #ff1744)");

              pinGroup.append("title").text(`${c.mint || "Mint"} (${c.denomination})`);
            }
          });
        });
      }, [statusMap, timelineYear, polygonColors, coins]);

      return (
        <div className="relative w-full h-full bg-[#06080e] overflow-hidden flex items-center justify-center">
          <svg ref={svgRef} viewBox="0 0 800 480" className="w-full h-full object-contain"></svg>

          <div className="absolute bottom-2.5 left-2.5 bg-[#0a0f1df2] p-2 rounded-xl border border-slate-800 text-[10px] backdrop-blur-md space-y-1">
            <div className="flex items-center gap-1.5 font-semibold text-slate-300">
              <span className="w-2 h-2 rounded-full bg-[#ff1744] shadow-[0_0_4px_#ff1744]"></span>
              Red Border = Away / Abroad
            </div>
            <div className="flex items-center gap-1.5 text-slate-400">
              <span className="w-2 h-2 bg-red-600 rounded-sm"></span>
              Diagonal Stripes = Territories & Empire Expansion
            </div>
          </div>
        </div>
      );
    }

    function EmpireInspector({ empire, coins, onClose, onAddCoinForNation }) {

    // --- Collection Vault Tab ---
    function CollectionVault({ coins, onDeleteCoin, onEditCoin, onOpenImage, onAddClick }) {
      const [query, setQuery] = useState("");
      const [filter, setFilter] = useState("all");

      const filtered = useMemo(() => {
        return coins.filter(c => {
          const matchQ = c.countryName.toLowerCase().includes(query.toLowerCase()) ||
            c.denomination.toLowerCase().includes(query.toLowerCase()) ||
            (c.mint && c.mint.toLowerCase().includes(query.toLowerCase())) ||
            (c.ruler && c.ruler.toLowerCase().includes(query.toLowerCase()));
          const matchF = filter === "all" ? true : filter === "in_hand" ? c.inPossession : !c.inPossession;
          return matchQ && matchF;
        });
      }, [coins, query, filter]);

      return (
        <div className="flex flex-col h-full p-3.5 overflow-y-auto hide-scrollbar space-y-3">
          <div className="flex gap-2">
            <input 
              type="text" 
              placeholder="Search ruler, mint, country..." 
              value={query}
              onChange={e => setQuery(e.target.value)}
              className="flex-1 bg-[#101524] border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-[#00f0ff]" 
            />
            <button onClick={onAddClick} className="bg-[#00f0ff] font-bold text-black text-xs px-3 rounded-xl shadow-lg">+ Add</button>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pb-8">
            {filtered.length === 0 ? (
              <div className="col-span-full py-16 text-center text-slate-500 text-xs">
                No coins found in vault. Tap + Add or tap any nation on the map!
              </div>
            ) : (
              filtered.map(coin => (
                <div 
                  key={coin.id} 
                  className={`bg-[#0f1424] border rounded-2xl p-3 space-y-2 relative ${!coin.inPossession ? "border-[#ff1744] shadow-[0_0_6px_rgba(255,23,68,0.2)]" : "border-slate-800"}`}>
                  
                  <div className="flex items-start justify-between">
                    <div>
                      <h3 className="font-bold text-sm text-white">{coin.countryName}</h3>
                      <p className="text-[11px] text-[#00f0ff] font-semibold">{coin.denomination}</p>
                    </div>

                    <div className="flex items-center gap-1">
                      <button onClick={() => onEditCoin(coin)} className="text-slate-400 hover:text-white p-1 text-xs" title="Edit Coin">✏️</button>
                      <button onClick={() => onDeleteCoin(coin.id)} className="text-slate-400 hover:text-red-400 p-1 text-xs" title="Delete Coin">🗑</button>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-1 bg-[#080b14] p-1.5 rounded-lg text-[10px] text-slate-300">
                    <div><span className="text-slate-500">Year:</span> {coin.year || "—"}</div>
                    <div><span className="text-slate-500">Grade:</span> {coin.grade || "UNC"}</div>
                    <div className="truncate"><span className="text-slate-500">Mint:</span> {coin.mint || "—"}</div>
                    <div className="truncate"><span className="text-slate-500">Shape:</span> {coin.shape || "Round"}</div>
                  </div>

                  {(coin.obverseImage || coin.reverseImage) && (
                    <div className="flex gap-2 pt-1 items-center">
                      {coin.obverseImage && (
                        <div className="cursor-pointer" onClick={() => onOpenImage(coin.obverseImage)}>
                          <img src={coin.obverseImage} className={`w-14 h-14 object-cover border border-slate-700 coin-mask-${coin.shape || 'round'}`} />
                        </div>
                      )}
                      {coin.reverseImage && (
                        <div className="cursor-pointer" onClick={() => onOpenImage(coin.reverseImage)}>
                          <img src={coin.reverseImage} className={`w-14 h-14 object-cover border border-slate-700 coin-mask-${coin.shape || 'round'}`} />

    // --- Add & Edit Coin Modal with Shape Clipping & Mint Pin Engine ---
    function AddEditCoinModal({ initialCountry, editingCoin, onClose, onSave }) {
      const [formData, setFormData] = useState(() => {
        if (editingCoin) return { ...editingCoin };
        return {
          countryCode: initialCountry?.a3 || "TUV",
          countryName: initialCountry?.name || "Tuvalu",
          isTerritory: !!initialCountry?.isTerritory,
          motherCountry: initialCountry?.mother || "",
          denomination: "",
          year: "",
          ruler: "",
          mint: "",
          mintCoords: initialCountry?.coords || [0, 0],
          grade: "UNC",
          shape: "round",
          inPossession: true,
          isUnion: false,
          neonColor: "cyan",
          notes: "",
          obverseImage: "",
          reverseImage: ""
        };
      });

      const handleImageUpload = (e, field) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxDim = 600;
            let width = img.width;
            let height = img.height;
            if (width > height && width > maxDim) {
              height *= maxDim / width;
              width = maxDim;
            } else if (height > maxDim) {
              width *= maxDim / height;
              height = maxDim;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            setFormData(prev => ({ ...prev, [field]: canvas.toDataURL("image/jpeg", 0.75) }));
          };
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-[#0e1424] border border-slate-800 rounded-t-3xl sm:rounded-3xl w-full max-w-lg p-4 max-h-[90vh] overflow-y-auto hide-scrollbar space-y-3.5">
            
            <div className="flex items-center justify-between pb-2 border-b border-slate-800">
              <h2 className="text-xs font-bold text-white">
                {editingCoin ? "Edit Coin:" : "Add Coin:"} <span className="text-[#00f0ff]">{formData.countryName}</span>
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white font-bold text-base">✕</button>
            </div>

            <form onSubmit={e => { e.preventDefault(); onSave(formData); }} className="space-y-3 text-xs">
              
              <div>
                <label className="text-slate-400 block mb-1">Country / Territory</label>
                <select 
                  value={formData.countryCode} 
                  onChange={e => {
                    const code = e.target.value;
                    const foundSov = SOVEREIGN_LIST.find(s => s.a3 === code);
                    const foundTer = TERRITORIES_LIST.find(t => t.code === code);
                    if (foundSov) setFormData(p => ({ ...p, countryCode: foundSov.a3, countryName: foundSov.name, isTerritory: false }));
                    if (foundTer) setFormData(p => ({ ...p, countryCode: foundTer.code, countryName: foundTer.name, isTerritory: true, motherCountry: foundTer.mother }));
                  }}
                  className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white">
                  <optgroup label="Sovereign Nations">
                    {SOVEREIGN_LIST.map(s => <option key={s.a3} value={s.a3}>{s.name} ({s.a3})</option>)}
                  </optgroup>
                  <optgroup label="Territories & Dependencies">
                    {TERRITORIES_LIST.map(t => <option key={t.code} value={t.code}>{t.name} ({t.mother})</option>)}
                  </optgroup>
                </select>
              </div>

              <div className="grid grid-cols-2 gap-2.5">
                <div>
                  <label className="text-slate-400 block mb-1">Denomination *</label>
                  <input required value={formData.denomination} onChange={e => setFormData({...formData, denomination: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">Year</label>
                  <input value={formData.year} onChange={e => setFormData({...formData, year: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
              </div>

              {/* Coin Shape Mask Selector */}
              <div>
                <label className="text-slate-400 block mb-1">Coin Silhouette Shape</label>
                <select 
                  value={formData.shape} 
                  onChange={e => setFormData({...formData, shape: e.target.value})}
                  className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white">
                  <option value="round">Round (Standard Circular)</option>
                  <option value="scalloped">Scalloped / Wavy (Eswatini, Tonga)</option>
                  <option value="heptagon">Heptagon (7-sided, UK 20p/50p)</option>
                  <option value="octagon">Octagon (8-sided, Chile, Lebanon)</option>
                  <option value="decagon">Decagon (10-sided, Philippines 2 Piso)</option>
                  <option value="dodecagon">Dodecagon (12-sided, Fiji 50c, UK £1)</option>
                  <option value="square">Square / Rounded Square (Aruba 50c)</option>
                </select>
              </div>

              <div className="grid grid-cols-2 gap-2.5">
                <div>
                  <label className="text-slate-400 block mb-1">Mint City / Mintmark</label>
                  <input value={formData.mint} onChange={e => setFormData({...formData, mint: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">Ruler / Head of State</label>
                  <input value={formData.ruler} onChange={e => setFormData({...formData, ruler: e.target.value})} className="w-full bg-[#151c30] border border-slate-700 rounded-xl p-2 text-white" />
                </div>
              </div>

              <div className="p-2.5 bg-[#12182b] rounded-xl border border-slate-800 flex items-center justify-between">
                <div>
                  <div className="font-semibold text-white">In Physical Possession</div>
                  <div className="text-[10px] text-slate-400">If unchecked, marked with slim red border</div>
                </div>
                <input 
                  type="checkbox" 
                  checked={formData.inPossession} 
                  onChange={e => setFormData({...formData, inPossession: e.target.checked})} 
                  className="w-5 h-5 accent-[#00f0ff]" 
                />
              </div>

              {/* Photo Uploads with Live Shape Mask Preview */}
              <div className="grid grid-cols-2 gap-2.5">
                <div>
                  <label className="text-slate-400 block mb-1">Front Photo</label>
                  {formData.obverseImage ? (
                    <div className="relative flex justify-center p-2 bg-[#090d18] rounded-xl">
                      <img src={formData.obverseImage} className={`w-16 h-16 object-cover border border-[#00f0ff] coin-mask-${formData.shape}`} />
                      <button type="button" onClick={() => setFormData({...formData, obverseImage: ""})} className="absolute top-1 right-1 bg-black/80 text-white rounded-full w-4 h-4 text-[9px]">✕</button>
                    </div>
                  ) : (
                    <input type="file" accept="image/*" onChange={e => handleImageUpload(e, 'obverseImage')} className="text-[9px] text-slate-400 file:py-1 file:px-2 file:rounded-md file:border-0 file:bg-slate-800 file:text-white" />
                  )}
                </div>

                <div>
                  <label className="text-slate-400 block mb-1">Back Photo</label>
                  {formData.reverseImage ? (
                    <div className="relative flex justify-center p-2 bg-[#090d18] rounded-xl">
                      <img src={formData.reverseImage} className={`w-16 h-16 object-cover border border-[#00f0ff] coin-mask-${formData.shape}`} />
                      <button type="button" onClick={() => setFormData({...formData, reverseImage: ""})} className="absolute top-1 right-1 bg-black/80 text-white rounded-full w-4 h-4 text-[9px]">✕</button>
                    </div>
                  ) : (
                    <input type="file" accept="image/*" onChange={e => handleImageUpload(e, 'reverseImage')} className="text-[9px] text-slate-400 file:py-1 file:px-2 file:rounded-md file:border-0 file:bg-slate-800 file:text-white" />
                  )}
                </div>
              </div>

              <button type="submit" className="w-full py-2.5 bg-[#00f0ff] hover:bg-[#00d0df] text-black font-extrabold rounded-xl text-xs uppercase tracking-wider shadow-lg">
                Save Coin to Vault
              </button>
            </form>
          </div>
        </div>
      );
    }

    // --- Option 2 Export / Import Sync Modal ---
    function SyncModal({ coins, onExport, onImport, onClose }) {
      const [importVal, setImportVal] = useState("");

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-[#0e1424] border border-slate-700 rounded-2xl w-full max-w-md p-4 space-y-3.5">
            <div className="flex items-center justify-between pb-1 border-b border-slate-800">
              <h3 className="text-xs font-bold text-white flex items-center gap-1.5">
                <span>⇄</span> Master Cloud Sync (Option 2)
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-sm">✕</button>
            </div>

            <div className="space-y-1.5">
              <button 
                onClick={onExport} 
                className="w-full py-2.5 bg-[#00f0ff] hover:bg-[#00d0df] text-black font-extrabold rounded-xl text-xs">
                Copy Vault JSON to Clipboard
              </button>
              <p className="text-[10px] text-slate-400 leading-relaxed">
                Paste this into line 42 of <code>index.html</code> in your GitHub repository and commit. Anyone opening the site will instantly see your full collection!
              </p>
            </div>

            <div className="pt-2 border-t border-slate-800 space-y-2">
              <label className="text-[11px] text-slate-300 font-semibold block">Import Collection Data:</label>
              <textarea 
                rows="3" 
                placeholder="Paste JSON string here..." 
                value={importVal} 
                onChange={e => setImportVal(e.target.value)} 
                className="w-full bg-[#141b2e] border border-slate-700 rounded-xl p-2 text-[10px] text-white focus:outline-none focus:border-[#00f0ff]" 
              />
              <button 
                onClick={() => onImport(importVal)} 
                className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs border border-slate-700">
                Load Imported Vault
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
