    const MICRO_STATES = [

      { a3: "TON", name: "Tonga", coords: [-175.198, -21.178] },
      { a3: "WSM", name: "Samoa", coords: [-172.104, -13.759] },
      { a3: "MCO", name: "Monaco", coords: [7.424, 43.738] },
      { a3: "SMR", name: "San Marino", coords: [12.457, 43.942] },

      { a3: "SGP", name: "Singapore", coords: [103.819, 1.352] },
      { a3: "BHR", name: "Bahrain", coords: [50.557, 26.066] },
      { a3: "SYC", name: "Seychelles", coords: [55.491, -4.679] }
    ];

    const ADJACENCY_MAP = {
      DZA: ["TUN", "LBY", "NER", "MLI", "MRT", "MAR"],
      MAR: ["DZA", "MRT", "ESP"],
      LBY: ["EGY", "SDN", "TCD", "NER", "DZA", "TUN"],
      EGY: ["LBY", "SDN", "ISR"],
      SDN: ["EGY", "LBY", "TCD", "CAF", "SSD", "ETH", "ERI"],
      SSD: ["SDN", "CAF", "COD", "UGA", "KEN", "ETH"],
      MLI: ["DZA", "NER", "BFA", "CIV", "GIN", "SEN", "MRT"],
      NER: ["LBY", "TCD", "NGA", "BEN", "BFA", "MLI", "DZA"],
      BFA: ["MLI", "NER", "BEN", "TGO", "GHA", "CIV"],
      CIV: ["LBR", "GIN", "MLI", "BFA", "GHA"],
      SEN: ["MRT", "MLI", "GIN", "GNB", "GMB"],
      BEN: ["NER", "NGA", "TGO", "BFA"],
      TGO: ["GHA", "BFA", "BEN"],
      GNB: ["SEN", "GIN"]
    };

    function App() {
      const [view, setView] = useState("map");
      const [coins, setCoins] = useState(() => {
        const saved = localStorage.getItem("numis_coins_data");
        return saved ? JSON.parse(saved) : [];
      });

      const [selectedCountry, setSelectedCountry] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [lightboxImg, setLightboxImg] = useState(null);
      const [searchQuery, setSearchQuery] = useState("");
      const [filterPossession, setFilterPossession] = useState("all");
      const [sortBy, setSortBy] = useState("country");

      useEffect(() => {
        localStorage.setItem("numis_coins_data", JSON.stringify(coins));
      }, [coins]);

      const countryCatalogStatus = useMemo(() => {
        const status = {};
        coins.forEach(coin => {
          let targets = [coin.countryCode];
          if (WEST_AFRICAN_CFA.includes(coin.countryCode) && coin.isUnion) {
            targets = WEST_AFRICAN_CFA;
          } else if (EASTERN_CARIBBEAN.includes(coin.countryCode) && coin.isUnion) {
            targets = EASTERN_CARIBBEAN;
          }
          targets.forEach(code => {
            if (!status[code]) {
              status[code] = {
                collected: true,
                neonColor: coin.neonColor,
                hasOverseasOnly: !coin.inPossession,
                count: 1
              };
            } else {
              status[code].count++;
              if (coin.inPossession) status[code].hasOverseasOnly = false;
            }
          });
        });
        return status;
      }, [coins]);

      const handleSaveCoin = (newCoin) => {
        const neighbors = ADJACENCY_MAP[newCoin.countryCode] || [];
        const usedColors = neighbors.map(code => countryCatalogStatus[code]?.neonColor).filter(Boolean);
        
        let validColor = newCoin.neonColor;
        if (usedColors.includes(validColor)) {
          const available = NEON_COLORS.find(c => !usedColors.includes(c.id));
          if (available) validColor = available.id;
        }

        const coinWithColor = { 
          ...newCoin, 
          neonColor: validColor, 
          id: Date.now().toString(), 
          createdAt: new Date().toISOString() 
        };
        setCoins(prev => [coinWithColor, ...prev]);
        setIsModalOpen(false);
      };

      const handleDeleteCoin = (coinId) => {
        if (window.confirm("Are you sure you want to delete this coin?")) {
          setCoins(prev => prev.filter(c => c.id !== coinId));
        }
      };

      const vaultCoins = useMemo(() => {
        return coins
          .filter(c => {
            const matchesSearch = c.countryName.toLowerCase().includes(searchQuery.toLowerCase()) ||
              c.denomination.toLowerCase().includes(searchQuery.toLowerCase()) ||
              (c.ruler && c.ruler.toLowerCase().includes(searchQuery.toLowerCase())) ||
              (c.mint && c.mint.toLowerCase().includes(searchQuery.toLowerCase()));
            const matchesPossession = 
              filterPossession === "all" ? true :
              filterPossession === "in_hand" ? c.inPossession : !c.inPossession;
            return matchesSearch && matchesPossession;
          })
          .sort((a, b) => {
            if (sortBy === "year") return (parseInt(b.year) || 0) - (parseInt(a.year) || 0);
            if (sortBy === "denomination") return a.denomination.localeCompare(b.denomination);
            return a.countryName.localeCompare(b.countryName);
          });
      }, [coins, searchQuery, filterPossession, sortBy]);

      return (
        <div className="flex flex-col h-screen max-w-md mx-auto sm:max-w-xl md:max-w-4xl bg-[#090b10] border-x border-slate-800">
          
          <header className="p-4 bg-[#0d111a] border-b border-slate-800 flex items-center justify-between">
            <div>
              <h1 className="text-lg font-black tracking-wider text-white flex items-center gap-2">
                <span className="w-2.5 h-2.5 rounded-full bg-[#00f0ff] inline-block shadow-[0_0_8px_#00f0ff]"></span>
                MISHA’S <span className="text-[#00f0ff]">COIN VAULT</span>
              </h1>
              <p className="text-[11px] text-slate-400">Personal Numismatic Archive</p>
            </div>
            
            <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
              <button 
                onClick={() => setView("map")} 
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${view === "map" ? "bg-[#00f0ff] text-black shadow-[0_0_12px_rgba(0,240,255,0.4)]" : "text-slate-400"}`}>
                Map
              </button>
              <button 
                onClick={() => setView("vault")} 
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${view === "vault" ? "bg-[#00f0ff] text-black shadow-[0_0_12px_rgba(0,240,255,0.4)]" : "text-slate-400"}`}>
                Collection ({coins.length})
              </button>
            </div>
          </header>

          <main className="flex-1 overflow-hidden relative">
            {view === "map" ? (
              <InteractiveWorldMap 
                statusMap={countryCatalogStatus} 
                onSelectCountry={(country) => {
                  setSelectedCountry(country);
                  setIsModalOpen(true);
                }} 
              />
            ) : (
              <CollectionVault 
                coins={vaultCoins} 
                searchQuery={searchQuery}
                setSearchQuery={setSearchQuery}
                filterPossession={filterPossession}
                setFilterPossession={setFilterPossession}
                sortBy={sortBy}
                setSortBy={setSortBy}
                onDeleteCoin={handleDeleteCoin}
                onOpenImage={(src) => setLightboxImg(src)}
                onAddClick={() => {
                  setSelectedCountry(null);
                  setIsModalOpen(true);
                }}
              />
            )}
          </main>

          {isModalOpen && (
            <AddCoinModal 
              initialCountry={selectedCountry}
              onClose={() => setIsModalOpen(false)}
              onSave={handleSaveCoin}
            />
          )}

          {lightboxImg && (
            <div 
              onClick={() => setLightboxImg(null)}
              className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
              <img src={lightboxImg} className="max-w-full max-h-[85vh] rounded-2xl object-contain shadow-[0_0_20px_rgba(0,0,0,0.8)]" />
              <button className="absolute top-5 right-5 text-white bg-slate-800/80 px-3 py-1.5 rounded-full text-sm font-bold">✕ Close</button>
            </div>
          )}
        </div>
      );
    }

    function InteractiveWorldMap({ statusMap, onSelectCountry }) {
      const svgRef = useRef(null);

      useEffect(() => {
        const width = 800;
        const height = 480;
        const svg = d3.select(svgRef.current);
        svg.selectAll("*").remove();

        const g = svg.append("g");
        const projection = d3.geoNaturalEarth1().scale(150).translate([width / 2, height / 1.9]);
        const path = d3.geoPath().projection(projection);

        const zoom = d3.zoom()
          .scaleExtent([1, 14])
          .on("zoom", (event) => g.attr("transform", event.transform));
        svg.call(zoom);

        Promise.all([
          d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
          d3.tsv("https://unpkg.com/world-atlas@1.1.4/world/110m.tsv")
        ]).then(([atlasData, tsvData]) => {
          const nameMap = {};
          tsvData.forEach(d => {
            nameMap[d.iso_n3] = { a3: d.iso_a3, name: d.name };
          });
          nameMap["728"] = { a3: "SSD", name: "South Sudan" };

          const countries = topojson.feature(atlasData, atlasData.objects.countries).features;

          // Render Main Polygons
          g.selectAll("path")
            .data(countries)
            .enter()
            .append("path")
            .attr("d", path)
            .attr("class", d => {
              const info = nameMap[d.id];
              const code = info ? info.a3 : null;
              const st = code ? statusMap[code] : null;

              if (!st) return "fill-[#141824] stroke-[#22293a] stroke-[0.4] hover:fill-[#20273a] transition-all cursor-pointer";
              
              let classes = `neon-${st.neonColor} cursor-pointer transition-all `;
              classes += st.hasOverseasOnly ? "border-red-glow" : "stroke-white/20 stroke-[0.4]";
              return classes;
            })
            .on("click", (event, d) => {
              const info = nameMap[d.id] || { a3: "WLD", name: "Selected Territory" };
              onSelectCountry(info);
            });

          // Render Micro-State Indicator Pins (Tuvalu, Monaco, etc.)
          g.selectAll(".micro-pin")
            .data(MICRO_STATES)
            .enter()
            .append("circle")
            .attr("class", d => {
              const st = statusMap[d.a3];
              if (!st) return "fill-[#242e44] stroke-cyan-400/60 hover:fill-[#00f0ff] cursor-pointer transition-all";
              let classes = `neon-${st.neonColor} cursor-pointer `;
              classes += st.hasOverseasOnly ? "border-red-glow stroke-[1.2]" : "stroke-white/70";
              return classes;
            })
            .attr("cx", d => {
              const p = projection(d.coords);
              return p ? p[0] : -999;
            })
            .attr("cy", d => {
              const p = projection(d.coords);
              return p ? p[1] : -999;
            })
            .attr("r", 2.5)
            .attr("stroke-width", 0.6)
            .on("click", (event, d) => {
              onSelectCountry({ a3: d.a3, name: d.name });
            });
        });
      }, [statusMap]);

      return (
        <div className="relative w-full h-full bg-[#07090e] flex items-center justify-center overflow-hidden">
          <svg ref={svgRef} viewBox="0 0 800 480" className="w-full h-full object-contain"></svg>
          
          <div className="absolute bottom-3 left-3 bg-[#0d121df0] p-2.5 rounded-xl border border-slate-800 text-[11px] backdrop-blur-md">
            <div className="flex items-center gap-2 mb-1.5">
              <span className="w-2 h-2 rounded-full bg-[#ff1744] shadow-[0_0_4px_#ff1744]"></span>
              <span className="text-slate-300 font-semibold">Red Border = Away / Abroad</span>
            </div>
            <div className="flex items-center gap-1.5 text-slate-400">
              <span className="w-1.5 h-1.5 rounded-full bg-[#00f0ff]"></span>
              <span className="w-1.5 h-1.5 rounded-full bg-[#ff007f]"></span>
              <span className="w-1.5 h-1.5 rounded-full bg-[#39ff14]"></span>
              <span className="w-1.5 h-1.5 rounded-full bg-[#ffaa00]"></span>
              <span className="w-1.5 h-1.5 rounded-full bg-[#b026ff]"></span>
              <span className="ml-1">5-Color Adjacency</span>
            </div>
          </div>
        </div>
      );
    }

    function CollectionVault({ coins, searchQuery, setSearchQuery, filterPossession, setFilterPossession, sortBy, setSortBy, onDeleteCoin, onOpenImage, onAddClick }) {
      return (
        <div className="flex flex-col h-full p-4 overflow-y-auto hide-scrollbar space-y-4">
          <div className="space-y-2">
            <input 
              type="text" 
              placeholder="Search country, ruler, mint, denomination..." 
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="w-full bg-[#121624] border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-[#00f0ff]"
            />

            <div className="flex gap-2 text-xs">
              <select 
                value={filterPossession} 
                onChange={(e) => setFilterPossession(e.target.value)}
                className="bg-[#121624] border border-slate-800 rounded-lg px-2.5 py-1.5 text-slate-300">
                <option value="all">All Locations</option>
                <option value="in_hand">In Hand</option>
                <option value="overseas">Abroad (Red Border)</option>
              </select>

              <select 
                value={sortBy} 
                onChange={(e) => setSortBy(e.target.value)}
                className="bg-[#121624] border border-slate-800 rounded-lg px-2.5 py-1.5 text-slate-300">
                <option value="country">Country (A-Z)</option>
                <option value="year">Year (Newest)</option>
                <option value="denomination">Denomination</option>
              </select>

              <button 
                onClick={onAddClick}
                className="ml-auto bg-[#00f0ff] hover:bg-[#00d0df] text-black font-bold px-3 py-1.5 rounded-lg text-xs shadow-[0_0_10px_rgba(0,240,255,0.3)]">
                + Add
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pb-8">
            {coins.length === 0 ? (
              <div className="col-span-full py-16 text-center text-slate-500 text-xs">
                No coins in your vault yet. Tap "+ Add" above or tap a country on the map!
              </div>
            ) : (
              coins.map((coin) => (
                <div 
                  key={coin.id} 
                  className={`bg-[#0f1422] border rounded-2xl p-3.5 space-y-2.5 relative transition-all ${!coin.inPossession ? "border-[#ff1744] shadow-[0_0_6px_rgba(255,23,68,0.2)]" : "border-slate-800"}`}>
                  
                  <div className="flex items-start justify-between">
                    <div>
                      <h3 className="font-bold text-sm text-white">{coin.countryName}</h3>
                      <p className="text-[11px] text-[#00f0ff] font-semibold">{coin.denomination}</p>
                    </div>
                    
                    <div className="flex items-center gap-1.5">
                      {!coin.inPossession && (
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-red-950 text-red-400 border border-red-800">
                          Abroad
                        </span>
                      )}
                      <button 
                        onClick={() => onDeleteCoin(coin.id)}
                        className="text-slate-500 hover:text-red-400 p-1 text-sm font-bold ml-1 transition-colors"
                        title="Delete this coin">
                        🗑️
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-1.5 bg-[#090c14] p-2 rounded-xl text-[11px] text-slate-300">
                    <div><span className="text-slate-500">Year:</span> {coin.year || "—"}</div>
                    <div><span className="text-slate-500">Grade:</span> {coin.grade || "UNC"}</div>
                    <div className="truncate"><span className="text-slate-500">Ruler:</span> {coin.ruler || "—"}</div>
                    <div className="truncate"><span className="text-slate-500">Mint:</span> {coin.mint || "—"}</div>
                  </div>

                  {(coin.obverseImage || coin.reverseImage) && (
                    <div className="flex items-center gap-2 pt-1">
                      {coin.obverseImage && (
                        <div className="relative group cursor-pointer" onClick={() => onOpenImage(coin.obverseImage)}>
                          <img src={coin.obverseImage} alt="Obverse" className="w-14 h-14 rounded-xl object-cover border border-slate-700 hover:border-[#00f0ff] transition-all" />
                          <span className="absolute bottom-0 inset-x-0 bg-black/70 text-[8px] text-center text-slate-300 rounded-b-xl py-0.5">Front</span>
                        </div>
                      )}
                      {coin.reverseImage && (
                        <div className="relative group cursor-pointer" onClick={() => onOpenImage(coin.reverseImage)}>
                          <img src={coin.reverseImage} alt="Reverse" className="w-14 h-14 rounded-xl object-cover border border-slate-700 hover:border-[#00f0ff] transition-all" />
                          <span className="absolute bottom-0 inset-x-0 bg-black/70 text-[8px] text-center text-slate-300 rounded-b-xl py-0.5">Back</span>
                        </div>
                      )}
                    </div>
                  )}

                  {coin.notes && <p className="text-[11px] text-slate-400 italic">"{coin.notes}"</p>}
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    function AddCoinModal({ initialCountry, onClose, onSave }) {
      const [formData, setFormData] = useState({
        countryCode: initialCountry?.a3 || "TUV",
        countryName: initialCountry?.name || "Tuvalu",
        denomination: "",
        year: "",
        ruler: "",
        mint: "",
        metal: "",
        grade: "UNC",
        inPossession: true,
        isUnion: false,
        neonColor: "cyan",
        notes: "",
        obverseImage: "",
        reverseImage: ""
      });

      const handleCountrySelect = (code) => {
        const found = SOVEREIGN_LIST.find(c => c.a3 === code);
        if (found) {
          setFormData(prev => ({ ...prev, countryCode: found.a3, countryName: found.name }));
        }
      };

      const handleImageUpload = (e, field) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxDim = 600;
            let width = img.width;
            let height = img.height;
            if (width > height && width > maxDim) {
              height *= maxDim / width;
              width = maxDim;
            } else if (height > maxDim) {
              width *= maxDim / height;
              height = maxDim;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            setFormData(prev => ({ ...prev, [field]: canvas.toDataURL("image/jpeg", 0.75) }));
          };
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-[#0e1320] border border-slate-800 rounded-t-3xl sm:rounded-3xl w-full max-w-lg p-5 max-h-[90vh] overflow-y-auto hide-scrollbar space-y-4">
            
            <div className="flex items-center justify-between pb-2 border-b border-slate-800">
              <h2 className="text-sm font-bold text-white">
                Add Coin: <span className="text-[#00f0ff]">{formData.countryName}</span>
              </h2>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-lg font-bold">✕</button>
            </div>

            <form onSubmit={(e) => { e.preventDefault(); onSave(formData); }} className="space-y-3 text-xs">
              
              {/* Country Selection Dropdown */}
              <div>
                <label className="text-slate-400 block mb-1">Country (Syncs directly to map)</label>
                <select 
                  value={formData.countryCode} 
                  onChange={(e) => handleCountrySelect(e.target.value)}
                  className="w-full bg-[#161c2e] border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-[#00f0ff]">
                  {SOVEREIGN_LIST.map(c => (
                    <option key={c.a3} value={c.a3}>{c.name} ({c.a3})</option>
                  ))}
                </select>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-slate-400 block mb-1">Denomination *</label>
                  <input required value={formData.denomination} onChange={e => setFormData({...formData, denomination: e.target.value})} className="w-full bg-[#161c2e] border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-[#00f0ff]" />
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">Year</label>
                  <input value={formData.year} onChange={e => setFormData({...formData, year: e.target.value})} className="w-full bg-[#161c2e] border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-[#00f0ff]" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-slate-400 block mb-1">Ruler / Head of State</label>
                  <input value={formData.ruler} onChange={e => setFormData({...formData, ruler: e.target.value})} className="w-full bg-[#161c2e] border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-[#00f0ff]" />
                </div>
                <div>
                  <label className="text-slate-400 block mb-1">Mint Location / Mintmark</label>
                  <input value={formData.mint} onChange={e => setFormData({...formData, mint: e.target.value})} className="w-full bg-[#161c2e] border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-[#00f0ff]" />
                </div>
              </div>

              <div className="p-3 bg-[#131929] rounded-xl border border-slate-800 flex items-center justify-between">
                <div>
                  <div className="font-semibold text-white">In Physical Possession</div>
                  <div className="text-[11px] text-slate-400">If unchecked, marked with slim red border</div>
                </div>
                <input 
                  type="checkbox" 
                  checked={formData.inPossession} 
                  onChange={e => setFormData({...formData, inPossession: e.target.checked})} 
                  className="w-5 h-5 accent-[#00f0ff]" 
                />
              </div>

              {(WEST_AFRICAN_CFA.includes(formData.countryCode) || EASTERN_CARIBBEAN.includes(formData.countryCode)) && (
                <div className="p-3 bg-[#131929] rounded-xl border border-slate-800 flex items-center justify-between">
                  <div>
                    <div className="font-semibold text-amber-400">Currency Union Member</div>
                    <div className="text-[11px] text-slate-400">Color all member states together</div>
                  </div>
                  <input 
                    type="checkbox" 
                    checked={formData.isUnion} 
                    onChange={e => setFormData({...formData, isUnion: e.target.checked})} 
                    className="w-5 h-5 accent-amber-500" 
                  />
                </div>
              )}

              <div className="grid grid-cols-2 gap-3 pt-1">
                <div>
                  <label className="text-slate-400 block mb-1">Front (Obverse) Photo</label>
                  {formData.obverseImage ? (
                    <div className="relative group">
                      <img src={formData.obverseImage} className="w-full h-20 object-cover rounded-xl border border-[#00f0ff]" />
                      <button type="button" onClick={() => setFormData(prev => ({...prev, obverseImage: ""}))} className="absolute top-1 right-1 bg-black/80 text-white rounded-full w-5 h-5 text-[10px] flex items-center justify-center">✕</button>
                    </div>
                  ) : (
                    <input type="file" accept="image/*" onChange={e => handleImageUpload(e, 'obverseImage')} className="text-[10px] text-slate-400 file:mr-2 file:py-1.5 file:px-2.5 file:rounded-lg file:border-0 file:bg-slate-800 file:text-white" />
                  )}
                </div>

                <div>
                  <label className="text-slate-400 block mb-1">Back (Reverse) Photo</label>
                  {formData.reverseImage ? (
                    <div className="relative group">
                      <img src={formData.reverseImage} className="w-full h-20 object-cover rounded-xl border border-[#00f0ff]" />
                      <button type="button" onClick={() => setFormData(prev => ({...prev, reverseImage: ""}))} className="absolute top-1 right-1 bg-black/80 text-white rounded-full w-5 h-5 text-[10px] flex items-center justify-center">✕</button>
                    </div>
                  ) : (
                    <input type="file" accept="image/*" onChange={e => handleImageUpload(e, 'reverseImage')} className="text-[10px] text-slate-400 file:mr-2 file:py-1.5 file:px-2.5 file:rounded-lg file:border-0 file:bg-slate-800 file:text-white" />
                  )}
                </div>
              </div>

              <div>
                <label className="text-slate-400 block mb-1">Acquisition Notes</label>
                <textarea rows="2" value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} className="w-full bg-[#161c2e] border border-slate-700 rounded-xl p-2.5 text-white focus:outline-none focus:border-[#00f0ff]" />
              </div>

              <button type="submit" className="w-full py-3 bg-[#00f0ff] hover:bg-[#00d0df] text-black font-extrabold rounded-xl text-xs uppercase tracking-wider shadow-[0_0_12px_rgba(0,240,255,0.3)]">
                Save Coin to Vault
              </button>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
